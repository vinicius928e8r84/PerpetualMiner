<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>PerpetualMiner</title>
  <link rel="stylesheet" href="veio/tokens.css">
  <script src="veio/tema.js"></script>
  <link rel="stylesheet" href="veio/componentes.css">
  <link rel="stylesheet" href="painel.css">
</head>
<body>

  <!--
    Shell “Ilhas” (docs/design/painel/shell/): a sidebar e o conteúdo são duas
    ilhas. Cada área tem endereço (#frases, #anki/<aba>, #configuracoes[/<seção>]),
    tratado por painel-shell.js. Os textos do shell vêm do catálogo da Voz pelos
    atributos data-voz / data-voz-aria / data-voz-title.
  -->
  <!--
    Boas-vindas (docs/design/painel/boas-vindas/, variante C): #boas-vindas[/<passo>],
    uma página sem a sidebar, que a instalação abre sozinha. A lista dos 8 itens
    e o card do passo são montados por painel-boas-vindas.js.
  -->
  <div class="bv" id="boas-vindas" hidden>
    <div class="bv-topo">
      <img class="veio-marca" src="veio/icones/icone.svg" width="40" height="40" alt="PerpetualMiner">
      <span class="veio-nome bv-nome" aria-hidden="true">Perpetual<b>Miner</b><span class="veio-cursor"></span></span>
    </div>
    <div class="bv-grade">
      <nav class="bv-lista" id="bv-lista"></nav>
      <main class="bv-card" aria-labelledby="bv-titulo">
        <p class="bv-sobretitulo" id="bv-sobretitulo"></p>
        <h2 class="bv-titulo" id="bv-titulo" tabindex="-1"></h2>
        <div class="bv-telas" id="bv-telas"></div>
        <div class="bv-rodape" id="bv-rodape"></div>
      </main>
    </div>
  </div>

  <div class="shell">

    <aside class="shell-lateral">
      <div class="shell-marca">
        <img class="veio-marca" src="veio/icones/icone.svg" width="30" height="30" alt="PerpetualMiner">
        <span class="veio-nome shell-rotulo" aria-hidden="true">Perpetual<b>Miner</b><span class="veio-cursor"></span></span>
      </div>

      <nav class="shell-nav" data-voz-aria="SHL-01.rotulo">
        <div class="shell-topo">
          <a class="shell-item" href="#frases" data-area="frases" aria-describedby="shell-total-descricao">
            <span data-icone="frases"></span>
            <span class="shell-rotulo" data-voz="SHL-01.frases"></span>
            <span class="shell-contador" id="shell-total" aria-hidden="true"></span>
          </a>
          <a class="shell-item" href="#anki/custos" data-area="anki" aria-describedby="shell-conexao-descricao">
            <span data-icone="anki"></span>
            <span class="shell-rotulo" data-voz="SHL-01.anki"></span>
            <span class="shell-ponto" data-estado="conectando" aria-hidden="true"></span>
          </a>
        </div>

        <div class="shell-pe">
          <a class="shell-item" href="#configuracoes" data-area="configuracoes">
            <span data-icone="configuracoes"></span>
            <span class="shell-rotulo" data-voz="SHL-01.configuracoes"></span>
          </a>
          <a class="shell-chip" id="shell-chip" href="#configuracoes/conta">
            <span class="shell-avatar" id="shell-avatar" aria-hidden="true"></span>
            <span class="shell-chip__quem shell-rotulo">
              <span class="shell-chip__nome" id="shell-chip-nome"></span>
              <span class="shell-chip__estado" id="shell-chip-estado"></span>
            </span>
          </a>
        </div>
      </nav>

      <!-- As descrições dos indicadores, para o leitor de tela (aria-describedby). -->
      <span id="shell-total-descricao" hidden></span>
      <span id="shell-conexao-descricao" hidden></span>
    </aside>

    <main class="shell-conteudo">

      <!-- ── Frases ─────────────────────────────────────────── -->
      <section class="shell-area" data-area="frases" aria-labelledby="titulo-frases">
        <header class="shell-cabecalho">
          <h1 id="titulo-frases" data-voz="SHL-02.frases"></h1>
          <!-- Minerar frases (ADD-01 · ADD-11): Colar e Arquivo .txt abrem o modal
               na aba certa; Foto abre Minerar de uma foto numa aba nova. -->
          <div class="minerar-menu">
            <button class="veio-botao veio-botao--primario" id="btn-minerar-frases" type="button"
                    aria-haspopup="menu" aria-expanded="false" aria-controls="menu-minerar">
              <span data-voz="ADD-01.botao"></span><span data-icone="abaixo"></span>
            </button>
            <div class="minerar-menu__lista" id="menu-minerar" role="menu" data-voz-aria="ADD-01.botao" hidden>
              <button class="minerar-menu__item" type="button" role="menuitem" tabindex="-1" data-minerar="colar">
                <span data-icone="colar"></span>
                <span><b data-voz="ADD-11.colar"></b><small data-voz="ADD-11.colarAjuda"></small></span>
              </button>
              <button class="minerar-menu__item" type="button" role="menuitem" tabindex="-1" data-minerar="arquivo">
                <span data-icone="arquivo"></span>
                <span><b data-voz="ADD-11.arquivo"></b><small data-voz="ADD-11.arquivoAjuda"></small></span>
              </button>
              <button class="minerar-menu__item" type="button" role="menuitem" tabindex="-1" data-minerar="foto">
                <span data-icone="foto"></span>
                <span><b data-voz="ADD-11.foto"></b><small data-voz="ADD-11.fotoAjuda"></small></span>
              </button>
            </div>
          </div>
        </header>

        <!-- O lembrete “Configuração pela metade” (ONB-15), enquanto a Boas-vindas
             não chegou a Tudo pronto e ele não foi ocultado (painel-lembrete.js). -->
        <aside class="frases-lembrete" id="frases-lembrete" aria-labelledby="frases-lembrete-texto" hidden>
          <span class="frases-lembrete__anel" id="frases-lembrete-anel"></span>
          <p class="frases-lembrete__texto" id="frases-lembrete-texto"></p>
          <div class="frases-lembrete__acoes">
            <button class="veio-botao veio-botao--fantasma veio-botao--compacto" id="frases-lembrete-ocultar" type="button"
                    data-voz="ONB-15.ocultar"></button>
            <button class="veio-botao veio-botao--contorno veio-botao--compacto" id="frases-lembrete-continuar" type="button"
                    data-voz="ONB-15.continuar"></button>
          </div>
        </aside>

        <!-- Os avisos persistentes da área (C1): a nuvem ficou com as frases
             apagadas (PAI-15) ou mineradas (ADD-06), e o copiar que não deu (PAI-17). -->
        <div class="frases-avisos" id="frases-avisos"></div>

        <!-- Filtros numa linha que quebra: Fonte · idioma · ordem, a busca e o toggle. -->
        <div class="frases-filtros">
          <span class="veio-select"><select class="veio-campo frases-filtro" id="filtro-fonte" data-voz-aria="PAI-25.fonte"></select></span>
          <span class="veio-select"><select class="veio-campo frases-filtro" id="filtro-idioma" data-voz-aria="PAI-25.idioma"></select></span>
          <span class="veio-select">
            <select class="veio-campo frases-filtro" id="filtro-ordem" data-voz-aria="PAI-25.ordem">
              <option value="novas" data-voz="PAI-24.novas"></option>
              <option value="antigas" data-voz="PAI-24.antigas"></option>
            </select>
          </span>
          <label class="veio-busca frases-busca">
            <span class="veio-busca__lupa"><span data-icone="busca"></span></span>
            <input class="veio-campo" id="busca-frases" type="search" autocomplete="off"
                   data-voz-aria="PAI-23" placeholder="">
            <button class="veio-botao-icone veio-busca__limpar" id="btn-limpar-busca" type="button"
                    data-voz-aria="PAI-04.acao" data-voz-title="PAI-04.acao" hidden><span data-icone="fechar"></span></button>
          </label>
          <label class="veio-toggle">
            <input type="checkbox" role="switch" id="filtro-ocultar">
            <span class="veio-toggle__trilho"></span>
            <span data-voz="PAI-09"></span>
          </label>
        </div>

        <!--
          A linha de seleção: sem seleção, o checkbox “Selecionar página”. Com
          seleção, ela vira a barra contextual (PAI-32), que gruda no topo da ilha
          ao rolar; o checkbox fica no começo dela, marcado ou misto, e o rótulo
          passa a ser só do leitor de tela.
        -->
        <div class="frases-selecao" id="frases-selecao" hidden>
          <label class="frases-selecao__pagina">
            <input type="checkbox" class="veio-checkbox" id="sel-pagina" data-voz-aria="PAI-31">
            <span class="frases-selecao__rotulo" id="sel-pagina-rotulo" data-voz="PAI-31"></span>
          </label>
          <div class="frases-barra" id="frases-barra" hidden>
            <button class="veio-botao-icone" id="btn-desmarcar-todas" type="button"
                    data-voz-aria="PAI-32.desmarcar" data-voz-title="PAI-32.desmarcar"><span data-icone="fechar"></span></button>
            <span class="frases-barra__contagem" id="selection-count" aria-live="polite"></span>
            <button class="veio-botao veio-botao--link frases-barra__todas" id="btn-sel-todas" type="button" hidden></button>
            <span class="frases-barra__acoes">
              <button class="veio-botao veio-botao--fantasma veio-botao--compacto" id="btn-bulk-edit" type="button">
                <span data-icone="contexto"></span><span data-voz="PAI-32.editarContexto"></span>
              </button>
              <button class="veio-botao veio-botao--fantasma veio-botao--compacto" id="btn-export" type="button">
                <span data-icone="arquivo"></span><span data-voz="PAI-32.exportar"></span>
              </button>
              <button class="veio-botao veio-botao--perigo-fantasma veio-botao--compacto" id="btn-delete-selected" type="button">
                <span data-icone="apagar"></span><span data-voz="PAI-32.apagar"></span>
              </button>
              <!-- Com a Conexão desligada fica aria-disabled (não disabled, para o tooltip
                   aparecer no hover e no foco), e o tooltip diz por quê (painel-envio.js). -->
              <span class="veio-com-dica">
                <button class="veio-botao veio-botao--primario veio-botao--compacto" id="btn-send-anki" type="button">
                  <span data-icone="enviar"></span><span data-voz="PAI-32.enviar"></span>
                </button>
                <span class="veio-dica" id="envio-indisponivel" role="tooltip"></span>
              </span>
            </span>
          </div>
        </div>

        <!-- PAI-01: enquanto a lista carrega, 5 cartões-esqueleto sem texto. -->
        <div id="frases-lista" class="frases-lista" aria-busy="true">
          <div class="veio-esqueleto veio-frase-esqueleto" aria-hidden="true"></div>
          <div class="veio-esqueleto veio-frase-esqueleto" aria-hidden="true"></div>
          <div class="veio-esqueleto veio-frase-esqueleto" aria-hidden="true"></div>
          <div class="veio-esqueleto veio-frase-esqueleto" aria-hidden="true"></div>
          <div class="veio-esqueleto veio-frase-esqueleto" aria-hidden="true"></div>
        </div>

        <!-- Paginação: “1–10 de 1.284” (PAI-07) à esquerda, « ‹ 1 de 129 › » à direita. -->
        <nav class="frases-paginas" id="frases-paginas" data-voz-aria="PAI-26.rotulo" hidden>
          <span class="frases-paginas__intervalo" id="paginas-intervalo"></span>
          <button class="veio-botao-icone" id="btn-first" type="button" data-voz-aria="PAI-26.primeira" data-voz-title="PAI-26.primeira"><span data-icone="primeira"></span></button>
          <button class="veio-botao-icone" id="btn-prev" type="button" data-voz-aria="PAI-26.anterior" data-voz-title="PAI-26.anterior"><span data-icone="anterior"></span></button>
          <span class="frases-paginas__atual" id="paginas-atual"></span>
          <button class="veio-botao-icone" id="btn-next" type="button" data-voz-aria="PAI-26.proxima" data-voz-title="PAI-26.proxima"><span data-icone="proxima"></span></button>
          <button class="veio-botao-icone" id="btn-last" type="button" data-voz-aria="PAI-26.ultima" data-voz-title="PAI-26.ultima"><span data-icone="ultima"></span></button>
        </nav>
      </section>

      <!-- ── Conexão com o Anki ─────────────────────────────── -->
      <section class="shell-area" data-area="anki" aria-labelledby="titulo-anki" hidden>
        <header class="shell-cabecalho">
          <h1 id="titulo-anki" data-voz="SHL-02.anki"></h1>
          <button id="btn-bridge-analytics-refresh-main" class="veio-botao veio-botao--contorno" type="button" data-voz-title="BRG-24">
            <span data-icone="atualizar"></span>
            <span data-voz="SHL-06"></span>
          </button>
        </header>

        <!-- F1: a Conexão com o Anki está desligada. -->
        <div class="veio-aviso shell-faixa" id="shell-faixa-conexao" role="status" hidden>
          <p class="veio-aviso__texto" data-voz="ENV-01.aviso"></p>
          <div class="veio-aviso__acoes">
            <button id="shell-tentar-de-novo" class="veio-botao veio-botao--contorno veio-botao--compacto" type="button" data-voz="ENV-01.tentarDeNovo"></button>
          </div>
        </div>

        <!-- Conectando: a primeira conferência da Conexão ainda não voltou (BRG-02). -->
        <div class="anki-faixa-conectando" id="anki-conectando" role="status" hidden>
          <span class="anki-ponto" aria-hidden="true"></span><span data-voz="BRG-02"></span>
        </div>

        <!-- Nunca conectada: o card ONB-16 fica no lugar das abas (desenho B, painel-anki-primeira-conexao.js). -->
        <section class="anki-primeira-vez" id="anki-primeira-vez" aria-labelledby="anki-primeira-vez-titulo" hidden>
          <div class="apv-topo">
            <h2 class="apv-titulo" id="anki-primeira-vez-titulo"></h2>
            <p class="apv-apoio" id="apv-apoio" data-voz="ONB-16.apoio"></p>
          </div>

          <!-- A lista de passos e o card do passo: o componente de painel-conexao-passos.js, o mesmo do passo 4 da Boas-vindas. -->
          <div id="apv-passos"></div>

          <div class="apv-rodape" id="apv-rodape">
            <p class="apv-confere"><span class="anki-ponto" aria-hidden="true"></span><span id="apv-confere"></span></p>
            <div class="apv-quadros">
              <div class="apv-quadro">
                <h3 data-voz="ONB-16.continuaTitulo"></h3>
                <p data-voz="ONB-16.continua"></p>
              </div>
              <div class="apv-quadro">
                <h3 data-voz="ONB-16.indisponivelTitulo"></h3>
                <p data-voz="ONB-16.indisponivel"></p>
              </div>
            </div>
          </div>
        </section>

        <div class="veio-segmentado shell-abas" role="radiogroup" data-voz-aria="SHL-03.rotulo">
          <label class="veio-segmentado__opcao"><input type="radio" name="aba-anki" value="custos"><span data-voz="SHL-03.custos"></span></label>
          <label class="veio-segmentado__opcao"><input type="radio" name="aba-anki" value="baralhos"><span data-voz="SHL-03.baralhos"></span></label>
          <label class="veio-segmentado__opcao"><input type="radio" name="aba-anki" value="vocabulario"><span data-voz="SHL-03.vocabulario"></span></label>
          <label class="veio-segmentado__opcao"><input type="radio" name="aba-anki" value="ajustes"><span data-voz="SHL-03.ajustes"></span></label>
        </div>

        <div class="shell-aba" data-aba="custos">
          <div class="anki-custos" id="anki-custos">
            <div class="anki-antigo" id="anki-custos-antigo" hidden></div>
            <div class="anki-barra">
              <div class="veio-segmentado" role="radiogroup" data-voz-aria="BRG-28.periodo">
                <label class="veio-segmentado__opcao"><input type="radio" name="periodo-custos" value="hoje"><span data-voz="BRG-28.hoje"></span></label>
                <label class="veio-segmentado__opcao"><input type="radio" name="periodo-custos" value="mes" checked><span data-voz="BRG-28.mes"></span></label>
                <label class="veio-segmentado__opcao"><input type="radio" name="periodo-custos" value="tudo"><span data-voz="BRG-28.tudo"></span></label>
              </div>
              <div class="anki-datas">
                <label class="anki-data"><span data-voz="BRG-28.de"></span><input type="date" id="anki-custos-de"></label>
                <label class="anki-data"><span data-voz="BRG-28.ate"></span><input type="date" id="anki-custos-ate"></label>
              </div>
            </div>
            <div class="anki-azulejos" id="anki-custos-azulejos" role="group" data-voz-aria="BRG-28.idiomas" hidden></div>
            <div id="anki-custos-corpo"></div>
            <details class="anki-avancado" id="anki-custos-avancado" hidden>
              <summary><span data-voz="BRG-32.titulo"></span> <small>· <span data-voz="BRG-32.resumo"></span></small></summary>
              <div class="anki-avancado__corpo">
                <dl class="anki-numeros" id="anki-custos-avancado-numeros"></dl>
                <div class="anki-avancado__chaves">
                  <label class="veio-toggle"><input type="checkbox" id="anki-quatro-casas"><span class="veio-toggle__trilho"></span><span data-voz="BRG-32.quatroCasas"></span></label>
                  <label class="veio-toggle"><input type="checkbox" id="anki-ids-dos-envios"><span class="veio-toggle__trilho"></span><span data-voz="BRG-32.ids"></span></label>
                </div>
                <div class="anki-diagnostico">
                  <h3 data-voz="BRG-32.diagnostico"></h3>
                  <p class="anki-apoio" data-voz="BRG-32.diagnosticoTexto"></p>
                  <table class="anki-tabela"><tbody id="anki-custos-diagnostico"></tbody></table>
                  <p class="anki-motivo" id="anki-diagnostico-falha" role="alert" hidden></p>
                </div>
              </div>
            </details>
          </div>
        </div>

        <!-- Baralhos e termos, Vocabulário e Reparar Anki: painel-anki-baralhos.js. -->
        <div class="shell-aba" data-aba="baralhos" hidden>
          <div class="anki-baralhos" id="anki-baralhos">
            <div class="anki-topo" id="anki-baralhos-topo"></div>
            <div class="anki-azulejos" id="anki-baralhos-azulejos" role="group" data-voz-aria="BRG-34.idiomas" hidden></div>
            <div class="anki-corpo" id="anki-baralhos-corpo"></div>
            <details class="anki-avancado" id="anki-baralhos-avancado">
              <summary><span data-voz="BRG-32.titulo"></span> <small>· <span data-voz="BRG-36.resumo"></span></small></summary>
              <div class="anki-avancado__corpo">
                <div class="anki-reparar">
                  <div class="anki-reparar__texto">
                    <b data-voz="BRG-11.repararAnki"></b>
                    <p class="anki-apoio" data-voz="BRG-36.texto"></p>
                  </div>
                  <span class="veio-com-dica">
                    <button id="btn-bridge-anki-repair" class="veio-botao veio-botao--contorno veio-botao--compacto" type="button" data-voz="BRG-11.repararAnki"></button>
                    <span class="veio-dica" role="tooltip" id="anki-reparar-indisponivel" data-voz="BRG-33.reparar"></span>
                  </span>
                </div>
              </div>
            </details>
          </div>
        </div>

        <div class="shell-aba" data-aba="vocabulario" hidden>
          <div class="anki-vocabulario" id="anki-vocabulario">
            <div class="anki-topo" id="anki-vocabulario-topo"></div>
            <div class="anki-azulejos" id="anki-vocabulario-azulejos" role="group" data-voz-aria="BRG-35.idiomas" hidden></div>
            <div class="anki-filtros" id="anki-vocabulario-filtros" hidden>
              <span class="veio-select"><select class="veio-campo" id="anki-vocabulario-tipo" data-voz-aria="BRG-35.tipo"></select></span>
              <span class="veio-select"><select class="veio-campo" id="anki-vocabulario-status" data-voz-aria="BRG-35.status"></select></span>
              <label class="veio-busca anki-busca">
                <span class="veio-busca__lupa"><span data-icone="busca"></span></span>
                <input class="veio-campo" id="anki-vocabulario-busca" type="search" autocomplete="off" data-voz-aria="BRG-35.buscar">
                <button class="veio-botao-icone veio-busca__limpar" id="anki-vocabulario-limpar" type="button"
                        data-voz-aria="BRG-35.limparBusca" data-voz-title="BRG-35.limparBusca" hidden><span data-icone="fechar"></span></button>
              </label>
            </div>
            <p class="anki-apoio anki-resumo" id="anki-vocabulario-resumo" role="status" hidden></p>
            <div class="anki-corpo" id="anki-vocabulario-corpo"></div>
          </div>
        </div>

        <div class="shell-aba" data-aba="ajustes" hidden>
          <!-- Com a Conexão desligada, os ajustes continuam editáveis (BRG-33). -->
          <p class="anki-nota" id="anki-ajustes-nota" data-voz="BRG-33.ajustes" hidden></p>
          <!--
            Ajustes de envio (painel-ajustes.js): um card por idioma, recolhível como os de
            Configurações; o card fechado mostra o que está gravado e o formulário só grava
            em Salvar ajustes.
          -->
          <div class="ajustes" id="ajustes">
            <div class="ajustes-aviso" id="ajustes-aviso"></div>
            <div class="shell-cards ajustes-cards" id="ajustes-cards" role="group" data-voz-aria="BRG-07.idiomas"></div>
          </div>
        </div>
      </section>

      <!-- ── Configurações ──────────────────────────────────── -->
      <section class="shell-area" data-area="configuracoes" aria-labelledby="titulo-configuracoes" hidden>
        <header class="shell-cabecalho">
          <h1 id="titulo-configuracoes" data-voz="SHL-02.configuracoes"></h1>
        </header>

        <!--
          Resumo primeiro (variante C): cada card é uma linha fechada com o resumo
          do estado e abre no lugar; vários podem ficar abertos. A linha inteira
          abre e fecha (painel-shell.js); o botão do título é o controle para o
          teclado e o leitor de tela. O card Conta & sync é desenhado por
          painel-conta.js, o Atalhos por painel-atalhos.js, o Chave do Gemini
          por painel-chave.js, o Conexão com o Anki por painel-abrir-anki.js e o
          Zona de perigo por painel-perigo.js.
        -->
        <div class="shell-cards">
          <section class="shell-card cfg-card" id="cfg-conta" aria-labelledby="cfg-conta-titulo">
            <div class="cfg-cabeca">
              <span class="cfg-icone"><span data-icone="conta"></span></span>
              <div class="cfg-titulos">
                <h2 class="shell-card__titulo">
                  <button class="cfg-alternar" id="cfg-conta-titulo" type="button" aria-expanded="false" aria-controls="cfg-conta-corpo" data-voz="SHL-04.conta"></button>
                </h2>
                <p class="cfg-descricao" data-voz="CFG-25"></p>
              </div>
              <span class="cfg-resumo" id="cfg-conta-resumo"></span>
              <span class="cfg-chevron"><span data-icone="abrir"></span></span>
            </div>
            <div class="cfg-corpo" id="cfg-conta-corpo" hidden></div>
          </section>
          <section class="shell-card cfg-card" id="cfg-atalhos" aria-labelledby="cfg-atalhos-titulo">
            <div class="cfg-cabeca">
              <span class="cfg-icone"><span data-icone="teclado"></span></span>
              <div class="cfg-titulos">
                <h2 class="shell-card__titulo">
                  <button class="cfg-alternar" id="cfg-atalhos-titulo" type="button" aria-expanded="false" aria-controls="cfg-atalhos-corpo" data-voz="SHL-04.atalhos"></button>
                </h2>
                <p class="cfg-descricao" data-voz="CFG-33"></p>
              </div>
              <span class="cfg-resumo" id="cfg-atalhos-resumo"></span>
              <span class="cfg-chevron"><span data-icone="abrir"></span></span>
            </div>
            <div class="cfg-corpo" id="cfg-atalhos-corpo" hidden></div>
          </section>
          <section class="shell-card cfg-card" id="cfg-ia" aria-labelledby="cfg-ia-titulo">
            <div class="cfg-cabeca">
              <span class="cfg-icone"><span data-icone="ia"></span></span>
              <div class="cfg-titulos">
                <h2 class="shell-card__titulo">
                  <button class="cfg-alternar" id="cfg-ia-titulo" type="button" aria-expanded="false" aria-controls="cfg-ia-corpo" data-voz="CFG-35.titulo"></button>
                </h2>
                <p class="cfg-descricao" data-voz="CFG-35.descricao"></p>
              </div>
              <span class="cfg-resumo" id="cfg-ia-resumo"></span>
              <span class="cfg-chevron"><span data-icone="abrir"></span></span>
            </div>
            <div class="cfg-corpo" id="cfg-ia-corpo" hidden></div>
          </section>
          <section class="shell-card cfg-card" id="cfg-chave" aria-labelledby="cfg-chave-titulo">
            <div class="cfg-cabeca">
              <span class="cfg-icone"><span data-icone="chave"></span></span>
              <div class="cfg-titulos">
                <h2 class="shell-card__titulo">
                  <button class="cfg-alternar" id="cfg-chave-titulo" type="button" aria-expanded="false" aria-controls="cfg-chave-corpo" data-voz="CFG-15.titulo"></button>
                </h2>
                <p class="cfg-descricao" data-voz="CFG-15.descricao"></p>
              </div>
              <span class="cfg-resumo" id="cfg-chave-resumo"></span>
              <span class="cfg-chevron"><span data-icone="abrir"></span></span>
            </div>
            <div class="cfg-corpo" id="cfg-chave-corpo" hidden></div>
          </section>
          <section class="shell-card cfg-card" id="cfg-anki" aria-labelledby="cfg-anki-titulo">
            <div class="cfg-cabeca">
              <span class="cfg-icone"><span data-icone="anki"></span></span>
              <div class="cfg-titulos">
                <h2 class="shell-card__titulo">
                  <button class="cfg-alternar" id="cfg-anki-titulo" type="button" aria-expanded="false" aria-controls="cfg-anki-corpo" data-voz="SHL-04.anki"></button>
                </h2>
                <p class="cfg-descricao" data-voz="CFG-40"></p>
              </div>
              <span class="cfg-resumo" id="cfg-anki-resumo"></span>
              <span class="cfg-chevron"><span data-icone="abrir"></span></span>
            </div>
            <div class="cfg-corpo" id="cfg-anki-corpo" hidden></div>
          </section>
          <section class="shell-card cfg-card" id="cfg-aparencia" aria-labelledby="cfg-aparencia-titulo">
            <div class="cfg-cabeca">
              <span class="cfg-icone"><span data-icone="tema"></span></span>
              <div class="cfg-titulos">
                <h2 class="shell-card__titulo">
                  <button class="cfg-alternar" id="cfg-aparencia-titulo" type="button" aria-expanded="false" aria-controls="cfg-aparencia-corpo" data-voz="CFG-29.titulo"></button>
                </h2>
                <p class="cfg-descricao" data-voz="CFG-29.descricao"></p>
              </div>
              <span class="cfg-resumo" id="cfg-aparencia-resumo"></span>
              <span class="cfg-chevron"><span data-icone="abrir"></span></span>
            </div>
            <div class="cfg-corpo" id="cfg-aparencia-corpo" hidden>
              <div class="veio-segmentado" id="cfg-tema" role="radiogroup" data-voz-aria="CFG-30.rotulo">
                <label class="veio-segmentado__opcao"><input type="radio" name="tema" value="escuro"><span data-voz="CFG-30.escuro"></span></label>
                <label class="veio-segmentado__opcao"><input type="radio" name="tema" value="claro"><span data-voz="CFG-30.claro"></span></label>
              </div>
            </div>
          </section>
          <section class="shell-card cfg-card shell-card--perigo" id="cfg-perigo" aria-labelledby="cfg-perigo-titulo">
            <div class="cfg-cabeca">
              <span class="cfg-icone"><span data-icone="perigo"></span></span>
              <div class="cfg-titulos">
                <h2 class="shell-card__titulo">
                  <button class="cfg-alternar" id="cfg-perigo-titulo" type="button" aria-expanded="false" aria-controls="cfg-perigo-corpo" data-voz="SHL-04.perigo"></button>
                </h2>
                <p class="cfg-descricao" id="cfg-perigo-descricao"></p>
              </div>
              <span class="cfg-resumo" id="cfg-perigo-resumo"></span>
              <span class="cfg-chevron"><span data-icone="abrir"></span></span>
            </div>
            <div class="cfg-corpo" id="cfg-perigo-corpo" hidden></div>
          </section>
        </div>
      </section>
    </main>
  </div>
  <!-- ── Editar contexto (PAI-20…22): 1 frase pela ação do cartão, N pela barra ── -->
  <div class="veio-scrim" id="modal-contexto" hidden>
    <div class="veio-modal" role="dialog" aria-labelledby="modal-contexto-titulo" aria-describedby="modal-contexto-subtitulo">
      <button class="veio-botao-icone veio-modal__fechar" type="button" data-fechar-modal
              data-voz-aria="PAI-34" data-voz-title="PAI-34"><span data-icone="fechar"></span></button>
      <h2 class="veio-modal__titulo" id="modal-contexto-titulo"></h2>
      <p class="veio-modal__corpo frases-modal__subtitulo" id="modal-contexto-subtitulo"></p>
      <form class="frases-modal__campos" id="form-contexto">
        <label class="frases-modal__campo">
          <span class="frases-modal__rotulo" data-voz="PAI-21.fonte"></span>
          <input class="veio-campo" id="modal-fonte" type="text" autocomplete="off" aria-describedby="modal-fonte-ajuda">
          <span class="frases-modal__ajuda" id="modal-fonte-ajuda" data-voz="PAI-21.fonteAjuda"></span>
        </label>
        <label class="frases-modal__campo">
          <span class="frases-modal__rotulo" data-voz="PAI-21.titulo"></span>
          <input class="veio-campo" id="modal-titulo" type="text" autocomplete="off">
        </label>
        <label class="frases-modal__campo">
          <span class="frases-modal__rotulo" data-voz="PAI-21.detalhe"></span>
          <input class="veio-campo" id="modal-detalhe" type="text" autocomplete="off" aria-describedby="modal-detalhe-ajuda">
          <span class="frases-modal__ajuda" id="modal-detalhe-ajuda" data-voz="PAI-21.detalheAjuda"></span>
        </label>
        <div class="veio-modal__acoes">
          <button class="veio-botao veio-botao--fantasma" type="button" data-fechar-modal data-voz="PAI-20.cancelar"></button>
          <button class="veio-botao veio-botao--primario" type="submit" data-voz="PAI-20.salvar"></button>
        </div>
      </form>
    </div>
  </div>

  <!-- ── Apagar (PAI-12 · PAI-13): um só modal para 1 frase e para a seleção ── -->
  <div class="veio-scrim" id="modal-apagar" hidden>
    <div class="veio-modal" role="dialog" aria-labelledby="modal-apagar-titulo" aria-describedby="modal-apagar-corpo">
      <button class="veio-botao-icone veio-modal__fechar" type="button" data-fechar-modal
              data-voz-aria="PAI-34" data-voz-title="PAI-34"><span data-icone="fechar"></span></button>
      <h2 class="veio-modal__titulo" id="modal-apagar-titulo"></h2>
      <p class="veio-modal__corpo" id="modal-apagar-corpo"></p>
      <div class="veio-modal__acoes">
        <button class="veio-botao veio-botao--fantasma" type="button" data-fechar-modal data-foco-seguro id="btn-apagar-cancelar"></button>
        <button class="veio-botao veio-botao--perigo-cheio" type="button" id="btn-apagar-confirmar"></button>
      </div>
    </div>
  </div>

  <!-- ── Minerar frases (ADD-01…12): Colar | Arquivo .txt | Foto ↗ ── -->
  <div class="veio-scrim" id="modal-minerar" hidden>
    <div class="veio-modal minerar-modal" role="dialog" aria-labelledby="modal-minerar-titulo">
      <button class="veio-botao-icone veio-modal__fechar" type="button" data-fechar-modal
              data-voz-aria="PAI-34" data-voz-title="PAI-34"><span data-icone="fechar"></span></button>
      <h2 class="veio-modal__titulo" id="modal-minerar-titulo" data-voz="ADD-01.botao"></h2>

      <div class="minerar-modal__edicao" id="minerar-edicao">
        <div class="minerar-abas">
          <div class="veio-segmentado" role="radiogroup" data-voz-aria="ADD-01.botao">
            <label class="veio-segmentado__opcao"><input type="radio" name="aba-minerar" value="colar"><span data-voz="ADD-01.colar"></span></label>
            <label class="veio-segmentado__opcao"><input type="radio" name="aba-minerar" value="arquivo"><span data-voz="ADD-01.arquivo"></span></label>
          </div>
          <!-- Foto não é uma aba: fecha o modal e abre Minerar de uma foto numa aba nova. -->
          <button class="veio-botao veio-botao--fantasma veio-botao--compacto minerar-abas__foto" type="button" id="btn-minerar-foto"
                  aria-describedby="minerar-foto-ajuda">
            <span data-voz="ADD-01.foto"></span><span data-icone="externo"></span>
          </button>
          <span id="minerar-foto-ajuda" data-voz="ADD-11.fotoAjuda" hidden></span>
        </div>

        <form class="minerar-colar" id="minerar-colar" novalidate>
          <label class="frases-modal__campo">
            <span class="frases-modal__rotulo" data-voz="ADD-12.campo"></span>
            <textarea class="veio-campo minerar-colar__frases" id="minerar-frases" rows="7" spellcheck="false"
                      aria-describedby="minerar-frases-erro"></textarea>
            <span class="veio-campo-erro" id="minerar-frases-erro" hidden></span>
          </label>
          <div class="minerar-colar__contexto">
            <label class="frases-modal__campo">
              <span class="frases-modal__rotulo" data-voz="PAI-21.fonte"></span>
              <input class="veio-campo" id="minerar-fonte" type="text" autocomplete="off">
            </label>
            <label class="frases-modal__campo">
              <span class="frases-modal__rotulo" data-voz="PAI-21.titulo"></span>
              <input class="veio-campo" id="minerar-titulo" type="text" autocomplete="off">
            </label>
          </div>
          <div class="veio-modal__acoes">
            <span class="minerar-contagem" id="minerar-contagem"></span>
            <button class="veio-botao veio-botao--fantasma" type="button" data-fechar-modal data-voz="ADD-12.cancelar"></button>
            <button class="veio-botao veio-botao--primario" type="submit" id="btn-minerar-colar"></button>
          </div>
        </form>

        <div class="minerar-arquivo" id="minerar-arquivo" hidden>
          <div class="minerar-arquivo__area">
            <b class="minerar-arquivo__nome" id="minerar-arquivo-nome"></b>
            <p class="minerar-arquivo__nota" data-voz="ADD-12.arquivoNota"></p>
            <input type="file" id="minerar-arquivo-escolha" accept=".txt,text/plain" hidden>
            <button class="veio-botao veio-botao--contorno veio-botao--compacto" type="button" id="btn-minerar-escolher"></button>
          </div>
          <p class="veio-campo-erro" id="minerar-arquivo-erro" role="alert" hidden></p>
          <p class="minerar-resultado" id="minerar-arquivo-resultado" role="status" hidden></p>
          <div class="veio-modal__acoes">
            <button class="veio-botao veio-botao--fantasma" type="button" data-fechar-modal id="btn-minerar-arquivo-sair"></button>
          </div>
        </div>
      </div>

      <!-- ADD-04: o progresso fica no próprio modal e anda a cada frase gravada. -->
      <div class="minerar-progresso" id="minerar-progresso" hidden>
        <b class="minerar-progresso__rotulo" id="minerar-progresso-rotulo" aria-live="polite"></b>
        <div class="minerar-progresso__barra" role="progressbar" aria-labelledby="minerar-progresso-rotulo"
             aria-valuemin="0"><i></i></div>
        <p class="minerar-progresso__nota" data-voz="ADD-12.progressoNota"></p>
      </div>
    </div>
  </div>

  <!-- ── Envio ao Anki: progresso (ENV-06…09, 13, 15), um cartão por Envio ── -->
  <div class="veio-scrim" id="modal-envio" hidden>
    <div class="veio-modal envio-modal" role="dialog" aria-labelledby="modal-envio-titulo" aria-describedby="modal-envio-detalhe">
      <button class="veio-botao-icone veio-modal__fechar" type="button" id="modal-envio-fechar"
              data-voz-aria="PAI-34" data-voz-title="PAI-34"><span data-icone="fechar"></span></button>
      <h2 class="veio-modal__titulo" id="modal-envio-titulo" data-voz="ENV-06.titulo"></h2>
      <p class="veio-modal__corpo" id="modal-envio-detalhe"></p>
      <p class="envio-modal__sem-noticia" id="modal-envio-sem-noticia" role="status" data-voz="ENV-09" hidden></p>
      <div class="envio-modal__envios" id="modal-envio-lista"></div>
      <p class="envio-modal__pe" data-voz="ENV-15"></p>
    </div>
  </div>

  <!-- ── Envio ao Anki: resumo (ENV-10…12), que abre sozinho em qualquer área ── -->
  <div class="veio-scrim" id="modal-resumo" hidden>
    <div class="veio-modal envio-modal" role="dialog" aria-labelledby="modal-resumo-titulo">
      <button class="veio-botao-icone veio-modal__fechar" type="button" id="modal-resumo-fechar"
              data-voz-aria="PAI-34" data-voz-title="PAI-34"><span data-icone="fechar"></span></button>
      <h2 class="veio-modal__titulo" id="modal-resumo-titulo"></h2>
      <p class="veio-modal__corpo" id="modal-resumo-detalhe"></p>
      <!-- Um bloco por idioma: +N cartões, o baralho, o que já estava e o que não entrou. -->
      <div class="envio-resumo__baralhos" id="modal-resumo-baralhos"></div>
      <div class="envio-resumo__historico">
        <p class="envio-resumo__pergunta" id="modal-resumo-pergunta"></p>
        <p class="envio-resumo__ajuda" id="modal-resumo-ajuda"></p>
      </div>
      <div class="veio-modal__acoes">
        <button class="veio-botao veio-botao--secundario" type="button" id="btn-resumo-manter"></button>
        <button class="veio-botao veio-botao--primario" type="button" id="btn-resumo-apagar">
          <span data-icone="apagar"></span><span data-voz="ENV-10.tirar"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- A ponte do abridor (lib/abridor.js): uma página vazia, recarregada a cada conversa com o abridor. -->
  <iframe id="abridor-ponte" src="abridor.html" hidden></iframe>

  <script src="painel-perigo.js"></script>

  <script src="painel-anki-primeira-conexao.js"></script>
