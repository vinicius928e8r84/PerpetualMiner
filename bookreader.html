<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minerar de uma foto · PerpetualMiner</title>
  <link rel="stylesheet" href="veio/tokens.css">
  <script src="veio/tema.js"></script>
  <link rel="stylesheet" href="veio/componentes.css">
  <link rel="stylesheet" href="bookreader.css">
</head>
<!--
  Minerar de uma foto, no layout C · Fotos × frases (docs/design/foto/): à
  esquerda a fila de fotos com o status de cada uma, à direita as frases
  agrupadas por foto. A cópia fixa vem do catálogo da Voz pelos atributos
  data-voz*, que o bookreader.js preenche ao carregar; o resto ele desenha.
-->
<body>
  <div class="foto">

    <header class="foto-topo">
      <img class="veio-marca" src="veio/icones/icone.svg" width="30" height="30" alt="">
      <div class="foto-nome">
        <h1 class="foto-titulo" data-voz="FOT-01.titulo"></h1>
        <span class="veio-nome" aria-hidden="true">Perpetual<b>Miner</b><span class="veio-cursor"></span></span>
      </div>
      <label class="foto-livro">
        <span class="foto-rotulo" data-voz="FOT-22.livro"></span>
        <input class="veio-campo" id="foto-livro" type="text" autocomplete="off" spellcheck="false"
               data-voz-placeholder="FOT-22.exemplo">
      </label>
      <button class="veio-botao veio-botao--fantasma foto-voltar" id="foto-voltar" type="button">
        <span data-icone="anterior"></span><span data-voz="FOT-22.voltar"></span>
      </button>
    </header>

    <div class="foto-corpo">

      <section class="foto-fotos" aria-labelledby="foto-fotos-titulo">
        <div class="foto-fotos__cabeca">
          <h2 class="foto-rotulo foto-rotulo--marcado" id="foto-fotos-titulo" data-voz="FOT-23.fotos"></h2>
          <span class="foto-fotos__total" id="foto-fotos-total" aria-hidden="true"></span>
        </div>

        <div class="foto-progresso" id="foto-progresso" hidden>
          <div class="foto-progresso__trilho"><i id="foto-progresso-barra"></i></div>
          <p class="foto-progresso__texto" id="foto-progresso-texto" aria-live="polite"></p>
        </div>

        <p class="foto-sem-chave" id="foto-sem-chave" data-voz="FOT-23.semChave" hidden></p>

        <div class="foto-envio" id="foto-envio" hidden>
          <span data-icone="manual"></span>
          <span class="foto-envio__texto">
            <span id="foto-envio-texto"></span>
            <span class="foto-envio__formatos" id="foto-envio-formatos" data-voz="FOT-02.formatos"></span>
          </span>
          <button class="veio-botao veio-botao--secundario veio-botao--compacto" id="foto-escolher" type="button"
                  data-voz="FOT-23.escolher"></button>
          <!-- O que a página anuncia (FOT-02) é o que ela aceita: o tipo e a
               extensão, porque o Chrome no Windows entrega o HEIC sem tipo. -->
          <input type="file" id="foto-arquivo" multiple hidden
                 accept="image/jpeg,image/png,image/webp,image/heic,.jpg,.jpeg,.png,.webp,.heic">
        </div>

        <ol class="foto-fila" id="foto-fila" aria-labelledby="foto-fotos-titulo" aria-live="polite"></ol>

        <div class="foto-legenda">
          <h2 class="foto-rotulo foto-rotulo--marcado" data-voz="FOT-24.titulo"></h2>
          <ul class="foto-marcacoes" id="foto-marcacoes"></ul>
        </div>
      </section>

      <section class="foto-frases">
        <div class="foto-avisos" id="foto-avisos"></div>
        <div id="foto-estado"></div>

        <div class="foto-lista" id="foto-lista" hidden>
          <div class="foto-lista__cabeca">
            <label class="foto-todas">
              <input class="veio-checkbox" id="foto-todas" type="checkbox">
              <span data-voz="FOT-25.selecionarTodas"></span>
            </label>
            <span class="foto-contagem" id="foto-contagem"></span>
          </div>
          <div id="foto-grupos"></div>
          <div class="foto-minerar">
            <button class="veio-botao veio-botao--primario" id="foto-minerar" type="button"></button>
          </div>
        </div>
      </section>

    </div>
  </div>

  <script src="lib/voz/catalogo.js"></script>
  <script src="lib/voz/texto.js"></script>
  <script src="veio/componentes.js"></script>
  <script src="lib/idioma.js"></script>
  <script src="bookreader.js"></script>
</body>
</html>
