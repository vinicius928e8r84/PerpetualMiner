<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- As únicas fontes que o Chromium dos testes enxerga: a DejaVu, de onde saem
     o serifado e os símbolos que as páginas usam sem declarar fonte (as fontes
     do Veio chegam pelo @font-face, fora do fontconfig). Sem isso, cada máquina
     (a do dev, o runner do CI) escolhia outra fonte de reserva e as fotos de
     referência só valiam onde foram tiradas.

     As regras de renderização e os apelidos genéricos do sistema entram arquivo a
     arquivo, e de propósito sem 50-user.conf (~/.fonts.conf e o XDG do usuário) e
     51-local.conf (a configuração local da máquina): são os dois pontos por onde
     outras fontes e outros apelidos entrariam. -->
<fontconfig>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <include ignore_missing="yes">/etc/fonts/conf.d/10-hinting-slight.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/10-scale-bitmap-fonts.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/10-sub-pixel-rgb.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/10-yes-antialias.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/11-lcdfilter-default.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/20-unhint-small-dejavu-lgc-sans-mono.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/20-unhint-small-dejavu-lgc-sans.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/20-unhint-small-dejavu-lgc-serif.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/20-unhint-small-dejavu-sans-mono.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/20-unhint-small-dejavu-sans.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/20-unhint-small-dejavu-serif.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/20-unhint-small-vera.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/30-metric-aliases.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/40-nonlatin.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/45-generic.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/45-latin.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/48-spacing.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/49-sansserif.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/57-dejavu-sans-mono.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/57-dejavu-sans.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/57-dejavu-serif.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/58-dejavu-lgc-sans-mono.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/58-dejavu-lgc-sans.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/58-dejavu-lgc-serif.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/60-generic.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/60-latin.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/65-fonts-persian.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/65-nonlatin.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/69-unifont.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/70-no-bitmaps-except-emoji.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/80-delicious.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/90-synthetic.conf</include>
  <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
