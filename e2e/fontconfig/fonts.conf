<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- As únicas fontes que o Chromium dos testes enxerga: a DejaVu, de onde saem
     o serifado e os símbolos que as páginas usam sem declarar fonte. Sem isso,
     cada máquina (a do dev, o runner do CI) escolhia outra fonte de reserva e
     as fotos de referência só valiam onde foram tiradas. As regras de
     renderização (hinting, antialias) continuam as do sistema. -->
<fontconfig>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <include ignore_missing="yes">/etc/fonts/conf.d</include>
  <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
