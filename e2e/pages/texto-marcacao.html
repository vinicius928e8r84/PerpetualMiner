<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Página comum · Texto com marcação</title>
</head>
<body>
  <!-- Como texto.html, mas o trecho a selecionar traz marcação como texto:
       a extensão tem de mostrá-la literalmente, sem criar elementos nem rodar o handler. -->
  <article>
    <h1>An article that quotes markup</h1>
    <p id="trecho">&lt;img src=x onerror="__injetado=1"&gt;Salt wind</p>
  </article>
</body>
</html>
