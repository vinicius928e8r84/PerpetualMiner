<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Galeria sem vídeo</title>
</head>
<body>
  <!-- Nenhum vídeo, mas legendas de imagem com as classes que os seletores
       genéricos de legenda procuram ("caption", "subtitle"). -->
  <h1>A small gallery</h1>
  <figure>
    <img alt="" width="320" height="200" style="background:#8a7">
    <figcaption class="caption">Fishing boats resting in the morning fog.</figcaption>
  </figure>
  <figure>
    <img alt="" width="320" height="200" style="background:#78a">
    <figcaption class="image-subtitle">The old lighthouse after the storm.</figcaption>
  </figure>
</body>
</html>
