<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Imagem promocional da loja</title>
  <link rel="stylesheet" href="/veio/tokens.css">
  <style>
    html, body { margin: 0; width: 440px; height: 280px; background: var(--veio-bg); overflow: hidden; }
    .promo { height: 280px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; font-family: var(--veio-fonte-ui); }
    .promo__nome { font-family: var(--veio-fonte-display); font-size: var(--veio-tam-display); font-weight: var(--veio-peso-display); letter-spacing: var(--veio-tracking-display); color: var(--veio-text); }
    .promo__frase { max-width: 320px; font-size: var(--veio-tam-destaque); line-height: var(--veio-altura-frase); color: var(--veio-muted); }
  </style>
</head>
<body>
  <div class="promo">
    <img src="/veio/icones/icone-128.png" alt="" width="96" height="96">
    <b class="promo__nome">PerpetualMiner</b>
    <span class="promo__frase">Frases de legendas, textos e fotos, prontas para estudar.</span>
  </div>
</body>
</html>
