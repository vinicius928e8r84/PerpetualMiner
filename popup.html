<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>PerpetualMiner</title>
  <link rel="stylesheet" href="veio/tokens.css">
  <script src="veio/tema.js"></script>
  <link rel="stylesheet" href="veio/componentes.css">
  <link rel="stylesheet" href="popup.css">
</head>
<!--
  Popup “Cockpit” (docs/design/popup/, variante A): uma pilha de 340 px, de cima
  para baixo — marca, Abrir painel, Mineração automática, mineração rápida, as
  5 últimas só leitura e o rodapé com o atalho de legenda. Toda a cópia vem do
  catálogo da Voz, escrita por popup.js; aqui só mora a estrutura.
-->
<body>

  <header class="popup-cabecalho">
    <img class="veio-marca" src="veio/icones/icone.svg" width="30" height="30" alt="PerpetualMiner">
    <span class="veio-nome popup-nome" aria-hidden="true">Perpetual<b>Miner</b><span class="veio-cursor"></span></span>
  </header>

  <main class="popup-corpo">

    <button type="button" class="veio-botao veio-botao--primario veio-botao--bloco" id="abrir-painel"></button>

    <section class="popup-secao" aria-labelledby="titulo-automatica">
      <h2 class="popup-titulo" id="titulo-automatica"><span id="titulo-automatica-texto"></span><span class="popup-titulo__lado" id="automatica-por-dia"></span></h2>
      <div class="popup-azulejos" id="azulejos"></div>
      <p class="popup-nota" id="nota-conexao" hidden></p>
    </section>

    <form class="popup-rapida" id="mineracao-rapida" novalidate>
      <div class="popup-rapida__campo">
        <textarea class="veio-campo" id="frase-rapida" rows="2" aria-describedby="erro-rapida"></textarea>
        <button type="submit" class="veio-botao veio-botao--secundario veio-botao--compacto" id="minerar-rapida" disabled></button>
      </div>
      <div class="popup-rapida__erro" id="erro-rapida" role="alert"></div>
    </form>

    <section class="popup-secao" aria-labelledby="titulo-ultimas">
      <h2 class="popup-titulo" id="titulo-ultimas"><span id="titulo-ultimas-texto"></span><button type="button" class="veio-botao veio-botao--link popup-titulo__lado" id="ver-todas" hidden></button></h2>
      <div id="ultimas" aria-live="polite"></div>
    </section>

  </main>

  <footer class="popup-rodape" id="rodape"></footer>

  <script src="lib/voz/catalogo.js"></script>
  <script src="lib/voz/texto.js"></script>
  <script src="veio/componentes.js"></script>
  <script src="lib/idioma.js"></script>
  <script src="lib/mineracao-rapida.js"></script>
  <script src="lib/atalhos.js"></script>
  <script src="lib/contexto.js"></script>
  <script src="popup.js"></script>
</body>
</html>
