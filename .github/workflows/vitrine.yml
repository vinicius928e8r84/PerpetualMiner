name: Vitrine

on:
  pull_request:
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - '!test_*.js'
      - manifest.json
      - lib/**
      - veio/**
      - conexao/**
      - docs/design/**
      - e2e/vitrine/**
      - preview/**
      - vercel.json
      - .github/workflows/vitrine.yml
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - '!test_*.js'
      - manifest.json
      - lib/**
      - veio/**
      - conexao/**
      - docs/design/**
      - e2e/vitrine/**
      - preview/**
      - vercel.json
      - .github/workflows/vitrine.yml

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vitrine-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vitrine:
    name: Vitrine (Vercel)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Conferir os segredos do Vercel
        id: segredos
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "prontos=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Vitrine::sem VERCEL_TOKEN, VERCEL_ORG_ID e VERCEL_PROJECT_ID nos segredos do repositório (ou PR de fork): nada foi publicado"
          fi
      - if: steps.segredos.outputs.prontos == 'true'
        uses: actions/checkout@v5
      - if: steps.segredos.outputs.prontos == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Publicar no Vercel
        id: publicar
        if: steps.segredos.outputs.prontos == 'true'
        run: |
          npm install --global vercel@65.16.0
          if [ "$EVENTO" = push ]; then
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            vercel build --prod --token="$VERCEL_TOKEN"
            endereco=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          else
            vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
            vercel build --token="$VERCEL_TOKEN"
            endereco=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          fi
          echo "endereco=$endereco" >> "$GITHUB_OUTPUT"
          echo "Publicado: $endereco" >> "$GITHUB_STEP_SUMMARY"
        env:
          EVENTO: ${{ github.event_name }}
          VERCEL_GIT_COMMIT_REF: ${{ github.head_ref || github.ref_name }}
          VERCEL_GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VERCEL_GIT_COMMIT_MESSAGE: ${{ github.event.pull_request.title || github.event.head_commit.message }}
      - name: Comentar o endereço na PR
        if: steps.segredos.outputs.prontos == 'true' && github.event_name == 'pull_request'
        run: |
          gh pr comment "$PR" --edit-last --create-if-none --body "Vitrine desta PR: $ENDERECO (commit ${HEAD:0:7})"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          ENDERECO: ${{ steps.publicar.outputs.endereco }}
