name: Testes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: testes-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rapidos:
    name: Testes rápidos
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: pip install -r engine/requirements.txt
      - run: npm ci --prefix scripts/regras/analisador
      - run: node scripts/testar.mjs node ferramentas engine
        env:
          PYTHON: python

  complemento:
    name: Testes do complemento (Python ${{ matrix.python }})
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 25
    env:
      RODAR_COMPLEMENTO: 'true'
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v5
        with:
          # O commit de merge da PR e os dois pais: HEAD^1 é a ponta da branch-alvo (PM_VERSAO_BASE abaixo).
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Classificar a mudança
        run: sh scripts/ci/classificar.sh
      - uses: actions/setup-python@v6
        if: env.RODAR_COMPLEMENTO == 'true'
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar o pwsh (se faltar)
        if: env.RODAR_COMPLEMENTO == 'true'
        run: |
          if ! command -v pwsh >/dev/null; then
            wget -q "https://packages.microsoft.com/config/ubuntu/$(. /etc/os-release && echo "$VERSION_ID")/packages-microsoft-prod.deb"
            sudo dpkg -i packages-microsoft-prod.deb
            sudo apt-get update
            sudo apt-get install -y powershell
          fi
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - if: env.RODAR_COMPLEMENTO == 'true'
        run: node scripts/testar.mjs complemento
        env:
          PM_PARALELO: '4'
          PYTHON: python
          EXIGIR_PWSH: '1'
          PM_VERSAO_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
          PM_VERSAO_NO_LANCAMENTO: ${{ github.event_name == 'push' && '1' || '' }}

  e2e:
    name: e2e (${{ matrix.fatia }}/8)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    env:
      RODAR_E2E: 'true'
    strategy:
      fail-fast: false
      matrix:
        fatia: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v5
        with:
          # O commit de merge da PR e os dois pais: HEAD^1 é a ponta da branch-alvo.
          fetch-depth: 2
      - uses: actions/setup-node@v5
        if: github.event_name == 'pull_request'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Classificar a mudança
        run: sh scripts/ci/classificar.sh
      - run: npm ci
        if: env.RODAR_E2E == 'true'
        working-directory: e2e
      - uses: actions/cache@v5
        if: env.RODAR_E2E == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-ubuntu-24.04-${{ hashFiles('e2e/package-lock.json') }}
      # Sem --with-deps: ele roda `apt` em toda fatia para instalar fontes que o Chromium dos testes não enxerga
      # (e2e/fontconfig), e a imagem já traz as bibliotecas. O teto de 5 minutos impede que uma rede ruim segure o job.
      - run: npx playwright install chromium
        if: env.RODAR_E2E == 'true'
        timeout-minutes: 5
        working-directory: e2e
      - if: env.RODAR_E2E == 'true'
        run: dpkg -s fonts-dejavu-core > /dev/null 2>&1 || sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      # Os specs desta fatia: scripts/ci/fatias-e2e.json, montadas pela duração de cada spec (o --shard do Playwright
      # divide pelo número de testes, e uma fatia levava 9 minutos enquanto outra levava 3).
      - if: env.RODAR_E2E == 'true'
        run: xvfb-run --auto-servernum node scripts/testar.mjs e2e -- --workers=2 $(node scripts/ci/fatias-e2e.js ${{ matrix.fatia }})
      - name: Testes instáveis
        id: instaveis
        if: ${{ !cancelled() && env.RODAR_E2E == 'true' }}
        run: node scripts/ci/instaveis.js e2e/test-results/relatorio.json
      - uses: actions/upload-artifact@v6
        if: ${{ (failure() || steps.instaveis.outputs.achou == 'true') && env.RODAR_E2E == 'true' }}
        with:
          name: e2e-${{ matrix.fatia }}-resultados
          path: e2e/test-results
          retention-days: 7

  e2e-conexao-real:
    name: e2e com a Conexão real
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    env:
      RODAR_CONEXAO_REAL: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        if: github.event_name == 'pull_request'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Classificar a mudança
        run: sh scripts/ci/classificar.sh
      - uses: actions/setup-python@v6
        if: env.RODAR_CONEXAO_REAL == 'true'
        with:
          python-version: '3.9'
      - run: npm ci
        if: env.RODAR_CONEXAO_REAL == 'true'
        working-directory: e2e
      - uses: actions/cache@v5
        if: env.RODAR_CONEXAO_REAL == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-ubuntu-24.04-${{ hashFiles('e2e/package-lock.json') }}
      - run: npx playwright install chromium
        if: env.RODAR_CONEXAO_REAL == 'true'
        timeout-minutes: 5
        working-directory: e2e
      - if: env.RODAR_CONEXAO_REAL == 'true'
        run: dpkg -s fonts-dejavu-core > /dev/null 2>&1 || sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - if: env.RODAR_CONEXAO_REAL == 'true'
        run: xvfb-run --auto-servernum node scripts/testar.mjs e2e -- conexao-real pareamento.spec pareamento-ataques --workers=1
        env:
          PM_CONEXAO: real
          PYTHON: python

  regras-do-firestore:
    name: Regras do Firestore (emulador)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v5
        with:
          path: ~/.cache/firebase/emulators
          key: emulador-do-firestore-1.22.0
      - name: Baixar o emulador (SHA-256 conferido pelo teste)
        run: |
          arquivo=~/.cache/firebase/emulators/cloud-firestore-emulator-v1.22.0.jar
          mkdir -p "$(dirname "$arquivo")"
          [ -f "$arquivo" ] || curl -fsSL -o "$arquivo" https://storage.googleapis.com/firebase-preview-drop/emulator/cloud-firestore-emulator-v1.22.0.jar
      - run: node scripts/testar.mjs firestore

  testes-ok:
    name: Testes ok
    if: ${{ always() }}
    needs: [rapidos, complemento, e2e, regras-do-firestore]
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    steps:
      - name: Todos os jobs de teste passaram
        env:
          RAPIDOS: ${{ needs.rapidos.result }}
          COMPLEMENTO: ${{ needs.complemento.result }}
          E2E: ${{ needs.e2e.result }}
          FIRESTORE: ${{ needs.regras-do-firestore.result }}
        run: |
          echo "Testes rápidos: $RAPIDOS; complemento: $COMPLEMENTO; e2e: $E2E; regras do Firestore: $FIRESTORE"
          [ "$RAPIDOS" = success ] && [ "$COMPLEMENTO" = success ] && [ "$E2E" = success ] && [ "$FIRESTORE" = success ]
