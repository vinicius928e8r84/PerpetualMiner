name: Testes

# O portão de cada PR: os testes de Node, os das ferramentas, os do motor,
# os do complemento do Anki (Python 3.9, o do Anki do Mac, e 3.13) e a suíte e2e inteira
# (a extensão desempacotada no Chromium). Quem trabalha roda só os specs da
# área que mudou; a suíte inteira roda aqui. Ver "Testing" no CLAUDE.md.
#
# Por padrão, os runners usam ubuntu-24.04 (não ubuntu-latest); CI_RUNS_ON pode selecionar
# outros labels em JSON (o runner próprio também precisa de Ubuntu 24.04): o Python 3.9 do complemento
# e o Chromium do Playwright dependem dele, e a mudança para o 26.04 será uma decisão à parte,
# tomada de propósito (e a chave do cache do Playwright abaixo já leva a versão do sistema).
#
# Cada job chama só `node scripts/testar.mjs <grupo>`, o mesmo comando que se roda aqui: o que cada
# grupo roda está em scripts/testes.json, e a regra `testes-no-portao` (node scripts/regras/verificar.js)
# falha quando um teste fica sem grupo, um grupo sem job aqui ou um teste roda por fora do executor.
#
# Para gastar menos minutos sem perder proteção: uma nova execução na mesma PR cancela a
# anterior; a e2e (91% dos minutos) só começa depois que Node, motor e complemento passam; e
# numa PR que mexe só em documentação as fatias e2e terminam sem rodar nada (os passos são
# pulados, não os jobs, para o nome e o resultado de cada fatia continuarem aparecendo). O push
# na main faz o mesmo: roda os jobs rápidos e as fatias e2e terminam sem rodar (a PR já passou
# por elas; isso basta quando a main estiver protegida para só entrar atualizada, AMB-02 b).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Só a PR cancela a execução anterior (ela é substituída pela do próximo commit). Cada push
# na main tem a sua, para nenhum commit dela ficar sem os testes rápidos e os do complemento.
concurrency:
  group: testes-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Os grupos rápidos e pequenos num job só (cada um custava 1 minuto cobrado por 6 a 18 s de trabalho).
  # Também decide se as fatias e2e têm o que rodar: numa PR, só se ela muda mais que documentação;
  # no push na main, nunca (os rápidos rodam inteiros).
  rapidos:
    name: Testes rápidos
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    outputs:
      rodar_e2e: ${{ steps.classificar.outputs.rodar_e2e }}
    steps:
      - uses: actions/checkout@v5
        with:
          # O commit de merge da PR e os dois pais: HEAD^1 é a ponta da branch-alvo.
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - id: classificar
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            # Se não der para ver o que mudou, a suíte roda.
            so_documentacao=$(node scripts/ci/so-documentacao.js HEAD^1 HEAD) || so_documentacao=false
            if [ "$so_documentacao" = true ]; then rodar=false; else rodar=true; fi
          else
            rodar=false
          fi
          echo "rodar_e2e=$rodar" >> "$GITHUB_OUTPUT"
          echo "rodar_e2e=$rodar"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: pip install -r engine/requirements.txt
      - run: node scripts/testar.mjs node ferramentas engine
        env:
          PYTHON: python

  complemento:
    name: Testes do complemento (Python ${{ matrix.python }})
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # O complemento usa só a biblioteca padrão: nada a instalar, só o pwsh, que roda o .ps1 do Conserto
      # (test_conserto_arvore_windows.py). A imagem do GitHub já o traz; o runner próprio (CI_RUNS_ON) pode não ter.
      - name: Instalar o pwsh (se faltar)
        run: |
          if ! command -v pwsh >/dev/null; then
            wget -q "https://packages.microsoft.com/config/ubuntu/$(. /etc/os-release && echo "$VERSION_ID")/packages-microsoft-prod.deb"
            sudo dpkg -i packages-microsoft-prod.deb
            sudo apt-get update
            sudo apt-get install -y powershell
          fi
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      # EXIGIR_PWSH=1: sem o pwsh os testes do .ps1 falham em vez de serem pulados.
      - run: node scripts/testar.mjs complemento
        env:
          PYTHON: python
          EXIGIR_PWSH: '1'

  e2e:
    name: e2e (${{ matrix.fatia }}/8)
    # Só depois que os testes rápidos passam: um erro de Node não gasta ~35 minutos de e2e.
    needs: [rapidos, complemento]
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    # Um worker por runner de 2 núcleos: com dois, o Chromium de cada teste disputa o
    # processador e os testes sensíveis a tempo (relógios, transições) falham sem motivo.
    # Uma fatia leva de 5 a 12 minutos num runner livre; 40 deixa passar um runner carregado e ainda impede que uma travada gaste 45.
    timeout-minutes: 40
    env:
      RODAR: ${{ needs.rapidos.outputs.rodar_e2e != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        fatia: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v5
        if: env.RODAR == 'true'
      - uses: actions/setup-node@v5
        if: env.RODAR == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        if: env.RODAR == 'true'
        working-directory: e2e
      - uses: actions/cache@v5
        if: env.RODAR == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-ubuntu-24.04-${{ hashFiles('e2e/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: env.RODAR == 'true'
        working-directory: e2e
      # A DejaVu é a única fonte que o Chromium dos testes enxerga (e2e/fontconfig).
      - if: env.RODAR == 'true'
        run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - if: env.RODAR == 'true'
        run: xvfb-run --auto-servernum node scripts/testar.mjs e2e -- --workers=1 --shard=${{ matrix.fatia }}/8
      # Quem falhou e passou na repetição (retries em e2e/playwright.config.js) aparece
      # como aviso e no resumo do job, para a repetição não esconder a instabilidade.
      - name: Testes instáveis
        id: instaveis
        if: ${{ !cancelled() && env.RODAR == 'true' }}
        run: node scripts/ci/instaveis.js e2e/test-results/relatorio.json
      # Também quando só oscilou: a imagem de diferença da primeira tentativa explica a oscilação.
      - uses: actions/upload-artifact@v6
        if: ${{ (failure() || steps.instaveis.outputs.achou == 'true') && env.RODAR == 'true' }}
        with:
          name: e2e-${{ matrix.fatia }}-resultados
          path: e2e/test-results
          retention-days: 7

  # A extensão diante da Conexão de verdade (PM_CONEXAO=real, e2e/conexao-real.js): só o spec conexao-real,
  # com o complemento do repositório no lugar do fake de JavaScript. Um job à parte, pequeno; não é um dos
  # checks que a proteção da main exige (scripts/ci/checks-obrigatorios.json).
  e2e-conexao-real:
    name: e2e com a Conexão real
    needs: [rapidos, complemento]
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    env:
      RODAR: ${{ needs.rapidos.outputs.rodar_e2e != 'false' }}
    steps:
      - uses: actions/checkout@v5
        if: env.RODAR == 'true'
      - uses: actions/setup-node@v5
        if: env.RODAR == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: actions/setup-python@v6
        if: env.RODAR == 'true'
        with:
          python-version: '3.9'
      - run: npm ci
        if: env.RODAR == 'true'
        working-directory: e2e
      - uses: actions/cache@v5
        if: env.RODAR == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-ubuntu-24.04-${{ hashFiles('e2e/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: env.RODAR == 'true'
        working-directory: e2e
      - if: env.RODAR == 'true'
        run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - if: env.RODAR == 'true'
        run: xvfb-run --auto-servernum node scripts/testar.mjs e2e -- conexao-real --workers=1
        env:
          PM_CONEXAO: real
          PYTHON: python
