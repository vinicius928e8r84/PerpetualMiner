name: Testes

# O portão de cada PR: os testes de Node, os do bridge e a suíte e2e inteira
# (a extensão desempacotada no Chromium). Quem trabalha roda só os specs da
# área que mudou; a suíte inteira roda aqui. Ver "Testing" no CLAUDE.md.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Testes de Node
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node test_auto_keyword.js
      - run: node test_sync.js
      - run: node test_empacotar.js

  bridge:
    name: Testes do bridge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bridge/requirements.txt
      - run: pip install -r bridge/requirements.txt
      - run: python -m unittest discover -s bridge -p "test_*.py"

  e2e:
    name: e2e (${{ matrix.fatia }}/8)
    runs-on: ubuntu-latest
    # Um worker por runner de 2 núcleos: com dois, o Chromium de cada teste disputa o
    # processador e os testes sensíveis a tempo (relógios, transições) falham sem motivo.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        fatia: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      # A DejaVu é a única fonte que o Chromium dos testes enxerga (e2e/fontconfig).
      - run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - run: xvfb-run --auto-servernum npx playwright test --workers=1 --shard=${{ matrix.fatia }}/8
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-${{ matrix.fatia }}-resultados
          path: e2e/test-results
          retention-days: 7
