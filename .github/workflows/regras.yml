name: Regras

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: regras-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  regras:
    name: Regras de revisão
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/testar.mjs regras
      - run: node scripts/regras/verificar.js
        env:
          REGRAS_BASE: ${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref) }}
      - name: Limite de tamanho dos arquivos
        if: ${{ !cancelled() }}
        run: node scripts/ganchos/limite-de-tokens.js --base "$REGRAS_BASE"
        env:
          REGRAS_BASE: ${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref) }}
      - name: Mapa de features
        if: github.event_name == 'pull_request'
        run: .agents/skills/verify-perpetualminer/scripts/mapa-de-features.sh "origin/${{ github.base_ref }}"
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
      - name: Autoria dos commits
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: node scripts/ci/autoria.js "origin/$BASE" "$HEAD"
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
