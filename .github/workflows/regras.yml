name: Regras

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read
  checks: read

concurrency:
  group: regras-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  regras:
    name: Regras de revisão
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci --prefix scripts/regras/analisador
      - run: node scripts/testar.mjs regras
      - run: node scripts/regras/verificar.js
        env:
          REGRAS_BASE: ${{ github.event_name == 'push' && github.event.before || 'HEAD^1' }}
      - name: Limite de tamanho dos arquivos
        if: ${{ !cancelled() }}
        run: node scripts/ganchos/limite-de-tokens.js --base "$REGRAS_BASE"
        env:
          REGRAS_BASE: ${{ github.event_name == 'push' && github.event.before || 'HEAD^1' }}
      - name: Mapa de features
        if: github.event_name == 'pull_request'
        run: .agents/skills/verify-perpetualminer/scripts/mapa-de-features.sh "origin/${{ github.base_ref }}"
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
      - name: Política do site
        if: github.event_name == 'pull_request'
        run: node scripts/ci/politica-do-site.js "origin/${{ github.base_ref }}"
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
      - name: Autoria dos commits
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: node scripts/ci/autoria.js "origin/$BASE" "$HEAD"
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
      - name: CodeScene em toda PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: node scripts/ci/codescene-em-toda-pr.js
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMERO: ${{ github.event.pull_request.number }}
          PR_CORPO: ${{ github.event.pull_request.body }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}

  pr-de-versao:
    name: PR de versão refeita
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/ci/pr-de-versao.js "$HEAD"
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
