name: Regras

# As regras de revisão que uma máquina confere (scripts/regras/, AGENTS.md § Rules and what enforces them).
# É o mesmo comando que se roda localmente. O histórico inteiro vem para a
# verificação comparar a linha de base e mostrar as linhas novas: no PR, com a
# ponta da branch-alvo; no push, com o commit anterior (não consigo mesma).
# Por padrão usa ubuntu-24.04; CI_RUNS_ON pode selecionar outros labels em JSON.
# O runner próprio também usa Ubuntu 24.04; migrar para o 26.04 será uma decisão à parte.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

# Só a PR cancela a execução anterior; cada push na main tem a sua.
concurrency:
  group: regras-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  regras:
    name: Regras de revisão
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/testar.mjs regras
      - run: node scripts/regras/verificar.js
        env:
          REGRAS_BASE: ${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref) }}
      # O mapa de features da skill de verificação: mexeu numa superfície do usuário, atualiza
      # .agents/skills/verify-perpetualminer/features/ ou escreve "feature map unchanged" no corpo do PR.
      - name: Mapa de features
        if: github.event_name == 'pull_request'
        run: .agents/skills/verify-perpetualminer/scripts/mapa-de-features.sh "origin/${{ github.base_ref }}"
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
      # A autoria: todo commit do PR (base..ponta da branch) tem como autor e committer o e-mail do
      # dono; o committer GitHub (noreply@github.com) passa em qualquer commit (scripts/ci/autoria.js).
      - name: Autoria dos commits
        if: github.event_name == 'pull_request'
        run: node scripts/ci/autoria.js "origin/$BASE" "$HEAD"
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
