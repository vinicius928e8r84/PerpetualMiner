name: Noturna

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/noturna.yml
      - scripts/ci/issue-da-noturna.js

permissions:
  contents: read

concurrency:
  group: noturna-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: Noturna e2e (${{ matrix.fatia }}/8)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        fatia: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-ubuntu-24.04-${{ hashFiles('e2e/package-lock.json') }}
      - run: npx playwright install chromium
        timeout-minutes: 5
        working-directory: e2e
      - run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - name: e2e da fatia (teto de 7 minutos)
        run: xvfb-run --auto-servernum node scripts/testar.mjs e2e -- --workers=1 $(node scripts/ci/fatias-e2e.js ${{ matrix.fatia }})
        env:
          PM_TETO_S: '420'
      - name: Testes instáveis
        id: instaveis
        if: ${{ !cancelled() }}
        run: node scripts/ci/instaveis.js e2e/test-results/relatorio.json
      - uses: actions/upload-artifact@v6
        if: ${{ failure() || steps.instaveis.outputs.achou == 'true' }}
        with:
          name: noturna-e2e-${{ matrix.fatia }}-resultados
          path: e2e/test-results
          retention-days: 7

  e2e-conexao-real:
    name: Noturna e2e com a Conexão real
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      - run: npm ci
        working-directory: e2e
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-ubuntu-24.04-${{ hashFiles('e2e/package-lock.json') }}
      - run: npx playwright install chromium
        timeout-minutes: 5
        working-directory: e2e
      - run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - run: xvfb-run --auto-servernum node scripts/testar.mjs e2e -- conexao-real pareamento.spec pareamento-ataques --workers=1
        env:
          PM_CONEXAO: real
          PYTHON: python

  complemento:
    name: Noturna complemento (Python ${{ matrix.python }})
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar o pwsh (se faltar)
        run: |
          if ! command -v pwsh >/dev/null; then
            wget -q "https://packages.microsoft.com/config/ubuntu/$(. /etc/os-release && echo "$VERSION_ID")/packages-microsoft-prod.deb"
            sudo dpkg -i packages-microsoft-prod.deb
            sudo apt-get update
            sudo apt-get install -y powershell
          fi
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - name: Testes do complemento (teto de 6 minutos)
        run: node scripts/testar.mjs complemento
        env:
          PM_TETO_S: '360'
          PYTHON: python
          EXIGIR_PWSH: '1'

  avisar:
    name: Issue da noturna
    needs: [e2e, e2e-conexao-real, complemento]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/ci/issue-da-noturna.js "$URL_DA_EXECUCAO" "$FATIAS" "$CONEXAO_REAL" "$COMPLEMENTO"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          URL_DA_EXECUCAO: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FATIAS: ${{ needs.e2e.result }}
          CONEXAO_REAL: ${{ needs.e2e-conexao-real.result }}
          COMPLEMENTO: ${{ needs.complemento.result }}
