name: Noturna

# A suíte e2e inteira na main, toda noite. O push na main só roda os testes rápidos e os do complemento
# (a e2e já passou na PR, workflow Testes); aqui a main inteira é provada de novo, e é esta execução, na
# main, que semeia o cache do Chromium para as PRs (a chave leva o hash do package-lock.json). Quando ela
# fica vermelha abre-se uma issue só (rótulo `noturna`), que ganha um comentário a cada noite vermelha e
# fecha sozinha na primeira noite verde (scripts/ci/issue-da-noturna.js).
#
# São 9 fatias: as 8 da e2e e a e2e com a Conexão real, as mesmas do workflow Testes. Rodar à mão:
# `gh workflow run noturna.yml` (Actions › Noturna › Run workflow). Mexer neste arquivo ou no script da
# issue numa PR também roda as fatias nela (sem abrir issue), para a alteração ser provada antes de mesclada.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/noturna.yml
      - scripts/ci/issue-da-noturna.js

permissions:
  contents: read

concurrency:
  group: noturna-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: Noturna e2e (${{ matrix.fatia }}/8)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        fatia: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-ubuntu-24.04-${{ hashFiles('e2e/package-lock.json') }}
      - run: npx playwright install chromium
        timeout-minutes: 5
        working-directory: e2e
      # A DejaVu é a única fonte que o Chromium dos testes enxerga (e2e/fontconfig).
      - run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - run: xvfb-run --auto-servernum node scripts/testar.mjs e2e -- --workers=1 --shard=${{ matrix.fatia }}/8
      # Quem falhou e passou na repetição aparece como aviso e no resumo do job.
      - name: Testes instáveis
        id: instaveis
        if: ${{ !cancelled() }}
        run: node scripts/ci/instaveis.js e2e/test-results/relatorio.json
      - uses: actions/upload-artifact@v6
        if: ${{ failure() || steps.instaveis.outputs.achou == 'true' }}
        with:
          name: noturna-e2e-${{ matrix.fatia }}-resultados
          path: e2e/test-results
          retention-days: 7

  e2e-conexao-real:
    name: Noturna e2e com a Conexão real
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      - run: npm ci
        working-directory: e2e
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-ubuntu-24.04-${{ hashFiles('e2e/package-lock.json') }}
      - run: npx playwright install chromium
        timeout-minutes: 5
        working-directory: e2e
      - run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - run: xvfb-run --auto-servernum node scripts/testar.mjs e2e -- conexao-real pareamento.spec pareamento-ataques --workers=1
        env:
          PM_CONEXAO: real
          PYTHON: python

  # Vermelha: abre a issue da noturna (ou comenta na que já está aberta). Verde: comenta e fecha a aberta.
  # Um job cortado pelo timeout-minutes termina cancelled e conta como vermelha; cancelar a execução à mão (cancelled()) ou pular não mexe em nada. Só a main escreve issue: numa PR, ou num disparo manual de outra branch, não.
  avisar:
    name: Issue da noturna
    needs: [e2e, e2e-conexao-real]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/ci/issue-da-noturna.js "$URL_DA_EXECUCAO" "$FATIAS" "$CONEXAO_REAL"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          URL_DA_EXECUCAO: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FATIAS: ${{ needs.e2e.result }}
          CONEXAO_REAL: ${{ needs.e2e-conexao-real.result }}
