<!doctype html>
<!--
  PROTÓTIPO DESCARTÁVEL: Painel · Conexão com o Anki · primeira conexão (ONB-16), identidade Veio,
  shell “Ilhas” (travado).
  Ticket: #74 "Protótipo: primeira conexão com o Anki (ONB-16)". Parte da revisão do PR #71.
  Pergunta: como a área recebe quem NUNCA teve a Conexão com o Anki respondendo neste computador,
  de um jeito que combine com o resto da experiência (Boas-vindas, Ilhas, Veio)? Hoje (PR #71) é
  um card de texto: título, corpo, “Como ligar” com 3 passos e Detalhes com Copiar.
  Três formas ESTRUTURALMENTE diferentes do mesmo estado, trocadas por ?variant=A|B|C (barra
  flutuante, ← →):
    A · Checklist vivo        uma coluna; 3 conferências que se marcam sozinhas, a pendente aberta
    B · Igual às Boas-vindas  lista de passos à esquerda + card do passo (sobretítulo, título 24/800,
                              bloco do controle, Voltar · Continuar), como a página Boas-vindas
    C · Caminho ilustrado     frase → Conexão com o Anki → Anki, o elo que falta destacado;
                              texto curto, comandos só no Detalhes
  Fixo nas três: shell Ilhas, cabeçalho com [↻ Atualizar], faixa F1 (ENV-01 + Tentar de novo) em
  cima enquanto desligada, faixa neutra BRG-02 enquanto conecta, e as abas voltando quando a
  conexão responde pela primeira vez.
  Cópia: catálogo da Voz (ONB-16, ONB-08, ONB-04, ENV-01, BRG-01/02/10/22). Cópia NOVA fica
  sublinhada em pontilhado com a etiqueta “rascunho” (desliga no painel do protótipo).
  VEREDITO (2026-09-29): B · Igual às Boas-vindas, travada, com o rodapé de A (confere sozinho +
  continua funcionando / fica indisponível) e menos texto; sem ler o AnkiConnect antes da Conexão.
  Abre em ?variant=B. A e C ficam só como registro das alternativas. A cópia nova da B entrou no
  catálogo como partes do ONB-16 (apoio, passo1Titulo…3, esperando, conferindo, conferindoAgora,
  continuaTitulo, continua, indisponivelTitulo, indisponivel, pronto, prontoApoio) e não é mais
  marcada como rascunho.
  Sem persistência: tudo em memória. Teclas: ← → trocam a variante · T alterna o tema.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protótipo · Primeira conexão com o Anki (Veio)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121110;--surface:#1B1A17;--surface-2:#262420;--border:#302D27;--border-strong:#736B5D;
  --text:#F2EEE6;--muted:#A89F90;--accent:#F5B83D;--accent-ink:#1A1204;--accent-text:#F5B83D;
  --kw-bg:rgba(245,184,61,.40);--success:#6FCF8E;--danger:#FF7A66;--info:#86BDF2;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
html[data-theme=light]{
  --bg:#F7F4EE;--surface:#FFFFFF;--surface-2:#F0EBE1;--border:#E4DCCD;--border-strong:#968C79;
  --text:#1C1A16;--muted:#625B4F;--accent:#F0AE2E;--accent-ink:#1A1204;--accent-text:#855608;
  --kw-bg:rgba(240,174,46,.45);--success:#1F7A45;--danger:#B42318;--info:#1D5FA8;
  --shadow:0 10px 30px rgba(60,45,20,.12);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:400 13.5px/1.5 Manrope,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--danger) 45%,transparent)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes flow{to{background-position:24px 0}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell Ilhas (travado) ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;padding:12px;gap:12px}
.side{display:flex;flex-direction:column;gap:6px;padding:18px 12px;position:sticky;top:12px;height:calc(100vh - 24px);min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.brand .tile{width:30px;height:30px;border-radius:8px;background:#1B1A17;display:grid;place-items:center;flex:none;border:1px solid #302D27}
.brand .name{font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.brand .name b{font-weight:800}
.brand .cur{display:inline-block;width:6px;height:15px;background:var(--accent);margin-left:3px;vertical-align:-2px;animation:blink 1.1s steps(1) infinite}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;color:var(--muted);text-decoration:none;font-weight:600;position:relative;min-width:0}
.nav a:hover{color:var(--text);background:var(--surface-2)}
.nav a[aria-current=page]{color:var(--text);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border-strong)}
.nav .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .count{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:999px;background:var(--success);flex:none;display:inline-block}
.dot.off{background:var(--danger)} .dot.wait{background:var(--muted);animation:blink 1.1s steps(1) infinite}
.spacer{flex:1}
.foot{display:flex;flex-direction:column;gap:6px;background:var(--surface-2);border-radius:14px;padding:4px}
.chip{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;text-decoration:none;color:inherit;min-width:0}
.avatar{width:30px;height:30px;border-radius:999px;background:linear-gradient(135deg,#8a6a2a,#3a2f1c);display:grid;place-items:center;font-weight:800;color:#F2EEE6;flex:none;font-size:12px}
.chip .who{min-width:0}
.chip .who b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .who span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap}
.main{min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px 28px 120px}
.area-head{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:18px}
.area-head h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}
.app.rail{grid-template-columns:76px minmax(0,1fr)}
.app.rail .brand .name,.app.rail .nav .lbl,.app.rail .nav .count,.app.rail .chip .who{display:none}
.app.rail .brand{justify-content:center;padding:2px 0 18px}
.app.rail .nav a{justify-content:center;padding:11px 0}
.app.rail .nav .dot{position:absolute;top:7px;right:14px;box-shadow:0 0 0 2px var(--surface)}
.app.rail .chip{justify-content:center;padding:8px 0}
.app.rail .main{padding:22px 20px 120px}

/* ---------- componentes Veio ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 16px;border:1px solid var(--border-strong);background:transparent;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 12px;font-size:12.5px}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.nav a:focus-visible,summary:focus-visible,.seg a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;background:var(--surface-2);padding:4px;border-radius:999px;gap:2px;flex-wrap:wrap}
.seg a{border:0;background:none;color:var(--muted);font-weight:600;padding:6px 14px;border-radius:999px;font-size:13px;cursor:pointer;white-space:nowrap;text-decoration:none}
.seg [aria-current=page]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid color-mix(in srgb,var(--danger) 50%,var(--border));background:color-mix(in srgb,var(--danger) 10%,transparent);border-radius:14px;padding:12px 14px;margin-bottom:16px}
.banner.info{border-color:var(--border);background:var(--surface-2)}
.banner p{margin:0;flex:1;min-width:200px}
details.det{margin-top:10px}
details.det summary{cursor:pointer;color:var(--muted);font-size:12px;font-weight:600;list-style:none;display:inline-flex;gap:4px}
details.det summary::-webkit-details-marker{display:none}
details.det summary::before{content:"›";display:inline-block;transition:transform .15s}
details.det[open] summary::before{transform:rotate(90deg)}
.cmds{display:flex;gap:10px;align-items:flex-start;margin-top:6px}
.cmds pre{flex:1;min-width:0;margin:0;background:var(--surface-2);border-radius:10px;padding:8px 10px;font:11.5px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word;color:var(--muted)}
.empty{text-align:center;padding:36px 20px;color:var(--muted);border:1px dashed var(--border-strong);border-radius:20px}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:6px}
.skel{background:linear-gradient(90deg,var(--surface-2),color-mix(in srgb,var(--surface-2) 40%,var(--bg)),var(--surface-2));background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:10px}
@keyframes sk{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:var(--text);color:var(--bg);border-radius:999px;padding:9px 18px;font-weight:600;z-index:80;box-shadow:var(--shadow);font-size:13px}
.spinner{width:16px;height:16px;border-radius:999px;border:2px solid var(--border-strong);border-top-color:var(--accent);animation:spin .8s linear infinite;display:inline-block;flex:none}
/* cópia nova (rascunho): marcada até entrar no catálogo */
.drafts .rasc{text-decoration:underline dotted color-mix(in srgb,var(--info) 80%,transparent);text-underline-offset:3px;text-decoration-thickness:1.5px}
.rasc-tag{display:none}
.drafts .rasc-tag{display:inline-block;font:700 9.5px/1.4 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--info);border:1px dashed var(--info);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:2px}

/* ---------- comum às variantes ---------- */
.first h2.t{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:0 0 6px}
.first .lead{color:var(--muted);margin:0 0 16px;max-width:640px}

/* ---------- A · Checklist vivo ---------- */
.A{max-width:720px}
.A-list{list-style:none;margin:0;padding:0;border:1px solid var(--border);border-radius:14px;background:var(--bg);overflow:hidden}
.A-row{border-top:1px solid var(--border)}
.A-row:first-child{border-top:0}
.A-head{display:flex;gap:12px;align-items:center;padding:14px 16px}
.A-ic{width:26px;height:26px;border-radius:999px;display:grid;place-items:center;flex:none;border:2px solid var(--border-strong);color:var(--muted);font:700 11px var(--mono)}
.A-ic.ok{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);animation:pop .35s ease-out}
.A-ic.now{border-color:var(--danger);color:var(--danger);animation:pulse 1.8s ease-out infinite}
.A-ic.run{border:0}
.A-ic.run .spinner{width:22px;height:22px}
.A-name{flex:1;min-width:0;font-weight:600}
.A-row.done .A-name{color:var(--muted)}
.A-state{font-size:12px;color:var(--muted);white-space:nowrap}
.A-state.ok{color:var(--success)}
.A-state.now{color:var(--danger)}
.A-body{padding:0 16px 16px 54px}
.A-body p{margin:0 0 10px}
.A-poll{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;margin:10px 2px 0}
.A-why{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.A-why div{border:1px dashed var(--border-strong);border-radius:14px;padding:10px 14px;font-size:12.5px;color:var(--muted)}
.A-why b{display:block;color:var(--text);font-size:13px;margin-bottom:2px}

/* ---------- B · Igual às Boas-vindas ---------- */
.B-top{text-align:left;margin-bottom:16px;max-width:900px}
.B-grid{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;max-width:900px}
.B-list{list-style:none;margin:0;padding:12px;display:flex;flex-direction:column;gap:2px;background:var(--bg);border:1px solid var(--border);border-radius:20px;align-self:start}
.B-list li button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 8px;border-radius:12px;cursor:pointer;text-align:left;color:var(--muted);font-weight:600}
.B-list li button[aria-current=step]{background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--border-strong)}
.B-list .sep{border-top:1px solid var(--border);margin:8px 4px;list-style:none}
.B-list .cap{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:2px 8px 6px}
.mark{width:22px;height:22px;border-radius:999px;border:2px solid var(--border-strong);display:grid;place-items:center;flex:none;font:700 11px var(--mono);color:var(--muted)}
.mark.cur2{border-color:var(--accent);color:var(--accent-text)}
.mark.ok{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mark.skip{border-style:dashed}
.B-card{background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:26px 28px;min-width:0;box-shadow:var(--shadow)}
.B-card .kicker{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.B-card h2{font-size:24px;letter-spacing:-.01em;margin:6px 0 8px;font-weight:800}
.B-card .lead{color:var(--muted);font-size:14.5px;margin:0 0 18px;max-width:560px}
.B-card .ctrl{border:1px solid var(--border);border-radius:14px;padding:14px 16px;background:var(--surface)}
.B-card .wfoot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:22px;border-top:1px solid var(--border);padding-top:16px}
.B-card .wfoot .grow{flex:1}
.status{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.B-foot{max-width:900px;margin-top:14px}
.B-foot .A-why{margin-top:12px}
.B-unl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.B-unl li{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);padding:2px 8px}
@media (max-width:760px){.B-grid{grid-template-columns:minmax(0,1fr)}}

/* ---------- C · Caminho ilustrado ---------- */
.C{max-width:860px}
.C-path{display:grid;grid-template-columns:minmax(0,170px) minmax(40px,1fr) minmax(0,170px) minmax(40px,1fr) minmax(0,170px);justify-content:center;align-items:center;padding:28px 22px 22px;border-radius:20px;background:var(--bg);border:1px solid var(--border);margin-bottom:18px}
.node{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;min-width:0}
.node .disc{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;border:2px solid var(--border-strong);background:var(--surface);color:var(--muted);position:relative}
.node .disc svg.i{width:30px;height:30px}
.node b{font-size:13.5px}
.node small{font-size:11.5px;color:var(--muted);display:block}
.node .badge{position:absolute;right:-8px;top:-8px;width:22px;height:22px;border-radius:999px;display:grid;place-items:center;font:700 11px var(--mono);border:2px solid var(--bg)}
.node.ok .disc{border-color:var(--accent);color:var(--accent-text);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.node.ok .badge{background:var(--accent);color:var(--accent-ink)}
.node.miss .disc{border-style:dashed;border-color:var(--danger);color:var(--danger);animation:pulse 1.8s ease-out infinite}
.node.miss .badge{background:var(--danger);color:var(--bg)}
.node.idle .disc{border-style:dashed}
.node.wait .disc{border-style:dashed;border-color:var(--accent)}
.node .tag{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;border-radius:999px;padding:1px 8px}
.node.miss .tag{color:var(--danger);background:color-mix(in srgb,var(--danger) 14%,transparent)}
.node.ok .tag{color:var(--accent-text);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.node.idle .tag{color:var(--muted);background:var(--surface-2)}
.node.wait .tag{color:var(--muted);background:var(--surface-2)}
.link{height:4px;border-radius:999px;align-self:start;margin:34px 6px 0;background:repeating-linear-gradient(90deg,var(--border-strong) 0 6px,transparent 6px 12px)}
.link.ok{background:var(--accent)}
.link.flow{background:repeating-linear-gradient(90deg,var(--accent) 0 12px,transparent 12px 24px);background-size:24px 4px;animation:flow .6s linear infinite}
.link.cut{background:repeating-linear-gradient(90deg,var(--danger) 0 6px,transparent 6px 12px)}
.C-fix{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;border:1px solid color-mix(in srgb,var(--danger) 40%,var(--border));border-radius:14px;padding:14px 16px;background:color-mix(in srgb,var(--danger) 5%,var(--bg))}
.C-fix .n{font:700 12px var(--mono);color:var(--danger);border:2px solid var(--danger);width:24px;height:24px;border-radius:999px;display:grid;place-items:center}
.C-fix b{font-size:14px}
.C-fix p{margin:2px 0 0;color:var(--muted)}
.C-fix.okk{border-color:color-mix(in srgb,var(--accent) 45%,var(--border));background:color-mix(in srgb,var(--accent) 6%,var(--bg))}
.C-fix.okk .n{color:var(--accent-text);border-color:var(--accent)}
.C-foot{margin-top:14px;color:var(--muted);font-size:12.5px}
@media (max-width:760px){
  .C-path{grid-template-columns:minmax(0,1fr);gap:6px}
  .link{width:4px;height:28px;margin:0 auto;background:repeating-linear-gradient(180deg,var(--border-strong) 0 6px,transparent 6px 12px)}
  .link.ok,.link.flow{background:var(--accent);animation:none}
  .link.cut{background:repeating-linear-gradient(180deg,var(--danger) 0 6px,transparent 6px 12px)}
  .main{padding:18px 16px 120px}
}

/* ---------- ferramentas do protótipo (não fazem parte do design) ---------- */
.proto{font-family:system-ui,sans-serif}
.switcher{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:#fff;color:#111;border-radius:999px;padding:6px;box-shadow:0 6px 24px rgba(0,0,0,.45);z-index:100;font:600 13px system-ui,sans-serif;max-width:calc(100vw - 24px)}
.switcher button{border:0;background:#111;color:#fff;border-radius:999px;width:32px;height:32px;cursor:pointer;font-size:15px;flex:none}
.switcher span{padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lab{position:fixed;right:12px;bottom:12px;z-index:90;background:#fff;color:#111;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.45);font:12.5px/1.4 system-ui,sans-serif;width:290px;max-width:calc(100vw - 24px);max-height:calc(100vh - 90px);overflow:auto}
.lab summary{cursor:pointer;padding:10px 14px;font-weight:700;list-style:none}
.lab summary::-webkit-details-marker{display:none}
.lab .body{padding:0 14px 12px;display:flex;flex-direction:column;gap:8px}
.lab label{display:flex;flex-direction:column;gap:3px;font-weight:600}
.lab label.ck{flex-direction:row;align-items:center;gap:6px;font-weight:500}
.lab select,.lab button{font:12.5px system-ui,sans-serif;padding:5px 8px;border-radius:8px;border:1px solid #bbb;background:#fff;color:#111}
.lab button{cursor:pointer;background:#111;color:#fff;border-color:#111}
.lab hr{border:0;border-top:1px solid #ddd;margin:2px 0}
.lab .note{font-size:11.5px;color:#444;background:#fff7e0;border:1px solid #f0d58a;border-radius:8px;padding:7px 8px}
.lab pre{margin:0;background:#f3f3f3;border-radius:8px;padding:8px;font:11px/1.45 ui-monospace,monospace;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body class="drafts">

<div class="app" id="app">
  <aside class="side" aria-label="Navegação do Painel">
    <div class="brand">

<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

<!-- ======= ferramentas do protótipo ======= -->
<details class="lab proto" id="lab" open>
  <summary>⚙ Estados do protótipo</summary>
  <div class="body">
    <label>Cenário<select id="s-cen">
      <option value="nunca">nunca conectada (nada pronto)</option>
      <option value="wait">conectando (depois de Tentar de novo)</option>
      <option value="on">a conexão responde → as abas voltam</option>
    </select></label>
    <label>Tentar de novo termina em<select id="s-retry"><option value="off">continua desligada</option><option value="on">a conexão responde</option></select></label>
    <button id="s-auto">Simular: a Conexão liga sozinha (sem clicar)</button>
    <button id="s-reset" style="background:#fff;color:#111">Voltar ao começo (nunca conectada)</button>
    <hr>
    <label class="ck"><input type="checkbox" id="s-drafts" checked> Marcar cópia nova (rascunho)</label>
    <label>Janela<select id="s-win"><option value="auto">automática (&lt; 1000 px = trilho)</option><option value="rail">forçar trilho</option><option value="wide">forçar larga</option></select></label>
    <div class="note">Decidido: o AnkiConnect não é lido antes da Conexão (sem permissão nova); o passo 1 espera a Conexão e vira ✓ junto com ela.</div>
    <pre id="readout"></pre>
  </div>
</details>
<div class="switcher proto" role="toolbar" aria-label="Trocar variante">
  <button id="sw-prev" aria-label="Variante anterior">←</button><span id="sw-label"></span><button id="sw-next" aria-label="Próxima variante">→</button>
</div>

<script>
/* ---------------- catálogo da Voz (trechos usados aqui) ---------------- */
const VOZ={
  'ONB-16.titulo':'Ainda não houve conexão neste computador',
  'ONB-16.corpo':'A Conexão com o Anki é um programa que roda neste computador, ao lado do Anki. É ela que cria os cartões e diz quais palavras você já conhece. Ela liga sozinha com o Windows depois de instalada uma vez. Sem ela, dá para minerar à vontade; o que fica indisponível é Enviar ao Anki e a mineração automática.',
  'ONB-16.passos':'Como ligar',
  'ONB-16.detalhes':'pip install -r bridge/requirements.txt\npython bridge/install_autostart.py\nOPENAI_API_KEY em engine/.env\nPorta: 127.0.0.1:8766 · log: bridge/runtime/bridge.log',
  'ONB-16.copiar':'Copiar','ONB-16.copiado':'Comandos copiados',
  'ONB-08.corpo':'A Conexão com o Anki é um programa que roda neste computador, ao lado do Anki. É ela que cria os cartões e diz quais palavras você já conhece. Ela liga sozinha com o Windows depois de instalada uma vez.',
  'ONB-08.passo1':'Abra o Anki neste computador, com o complemento AnkiConnect.',
  'ONB-08.passo2':'Instale a Conexão com o Anki uma vez (veja Detalhes). Depois ela liga sozinha com o Windows.',
  'ONB-08.passo3':'Volte aqui e use Tentar de novo.',
  'ONB-04.voltar':'Voltar','ONB-04.continuar':'Continuar',
  'ENV-01.aviso':'A conexão com o Anki está desligada. Ligue-a neste computador e tente de novo.',
  'ENV-01.tentarDeNovo':'Tentar de novo',
  'BRG-01.ligada':'Conexão com o Anki: ligada','BRG-01.desligada':'Conexão com o Anki: desligada',
  'ONB-16.apoio':'A Conexão com o Anki roda neste computador, ao lado do Anki, e é ela que cria os cartões.',
  'ONB-16.passo1Titulo':'Abrir o Anki','ONB-16.passo2Titulo':'Instalar a Conexão com o Anki','ONB-16.passo3Titulo':'Tentar de novo',
  'ONB-16.esperando':'Esperando a Conexão',
  'ONB-16.conferindo':'Confere sozinho a cada 15 s · última vez há {segundos} s','ONB-16.conferindoAgora':'Conferindo agora…',
  'ONB-16.continuaTitulo':'Continua funcionando','ONB-16.continua':'Minerar de vídeos, páginas e fotos.',
  'ONB-16.indisponivelTitulo':'Fica indisponível sem ela','ONB-16.indisponivel':'Enviar ao Anki e a mineração automática.',
  'ONB-16.pronto':'Pronto','ONB-16.prontoApoio':'As abas voltam em seguida.',
  'ONB-03.passo':'Passo {n} de {total}',
  'BRG-02':'Conectando ao Anki…','BRG-10':'Lendo os baralhos do Anki…','BRG-22':'Nenhum envio neste período.',
};
const v=(id,val={})=>VOZ[id].replace(/\{(\w+)\}/g,(_,k)=>val[k]);
// “Sem ela…”: a segunda metade do ONB-16.corpo (o que falta sem ela, da F1)
const SEM_ELA=v('ONB-16.corpo').slice(v('ONB-08.corpo').length+1);
// cópia nova: sublinhado pontilhado + etiqueta “rascunho”
const r=(t,tag=false)=>`<span class="rasc" title="Rascunho: cópia nova, ainda fora do catálogo da Voz">${t}</span>${tag?'<span class="rasc-tag">rascunho</span>':''}`;

const VARIANTS={A:'Checklist vivo',B:'Igual às Boas-vindas · TRAVADA',C:'Caminho ilustrado'};
const KEYS=Object.keys(VARIANTS);
const $=s=>document.querySelector(s);
let qs=null;try{qs=new URLSearchParams(location.search);}catch(e){}
const S={variant:VARIANTS[qs?.get('variant')]?qs.get('variant'):'B',theme:qs?.get('theme')==='light'?'light':'dark',
  anki:false,con:'off',phase:'first',retry:'off',win:'auto',drafts:true,bStep:null,poll:4,checking:false,det:{}};

/* ---------------- ícones ---------------- */
const IC={
  check:'<svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px;stroke-width:3"><path d="M5 12l5 5 9-10"/></svg>',
  frases:'<svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  plug:'<svg class="i" viewBox="0 0 24 24"><path d="M9 7V3M15 7V3M7 7h10v4a5 5 0 0 1-10 0V7ZM12 16v5"/></svg>',
  cards:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>',
  send:'<svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M4 12h14M13 6l6 6-6 6"/></svg>',
};

/* ---------------- pedaços compartilhados ---------------- */
function comandos(){
  const open=S.det.cmd?' open':'';
  return `<details class="det" data-det="cmd"${open}><summary>Detalhes</summary><div class="cmds"><pre>${v('ONB-16.detalhes')}</pre><button class="btn sm" data-copiar>${v('ONB-16.copiar')}</button></div></details>`;
}
const conOn=()=>S.con==='on';
const celebrating=()=>conOn()&&S.phase==='celebrate';

/* ================= A · CHECKLIST VIVO ================= */
function A(){
  // 3 conferências, na ordem dos passos da F1; a primeira que falta fica aberta
  const w=S.con==='wait';
  const checks=[
    {id:'anki',name:r('Anki aberto, com o AnkiConnect'),ok:S.anki||conOn(),
      body:`<p>${v('ONB-08.passo1')}</p>`,
      miss:r('não encontrado')},
    {id:'con',name:r('Conexão com o Anki instalada e ligada'),ok:conOn(),run:w,
      body:`<p>${v('ONB-08.passo2')}</p>${comandos()}`,
      miss:r('não respondeu')},
    {id:'deck',name:r('Primeira leitura dos baralhos'),ok:conOn()&&S.phase!=='reading',run:conOn()&&S.phase==='reading',
      body:`<p class="muted">${r('Acontece sozinha assim que a Conexão responder.')}</p>`,
      miss:r('esperando a Conexão')},
  ];
  let firstMiss=checks.findIndex(c=>!c.ok&&!c.run);
  const rows=checks.map((c,i)=>{
    const st=c.ok?'ok':c.run?'run':i===firstMiss?'now':'todo';
    const ic=st==='ok'?`<span class="A-ic ok">${IC.check}</span>`:st==='run'?'<span class="A-ic run"><span class="spinner"></span></span>':`<span class="A-ic ${st}">${i+1}</span>`;
    const label=st==='ok'?`<span class="A-state ok">${r('pronto')}</span>`:st==='run'?`<span class="A-state">${c.id==='deck'?v('BRG-10'):r('conferindo…')}</span>`:st==='now'?`<span class="A-state now">${c.miss}</span>`:`<span class="A-state">${c.miss}</span>`;
    return `<li class="A-row${c.ok?' done':''}"><div class="A-head">${ic}<span class="A-name">${c.name}</span>${label}</div>${st==='now'?`<div class="A-body">${c.body}</div>`:''}</li>`;
  }).join('');
  const poll=conOn()?'':`<div class="A-poll">${S.checking||w?'<span class="spinner" style="width:12px;height:12px"></span>':'<span class="dot wait"></span>'}<span id="poll-t">${pollText()}</span></div>`;
  return `<div class="first A"><h2 class="t">${celebrating()?v('BRG-01.ligada'):v('ONB-16.titulo')}</h2>
    <p class="lead">${celebrating()?r('Tudo pronto. As abas voltam em seguida.',true):v('ONB-08.corpo')}</p>
    <ol class="A-list" aria-label="${v('ONB-16.passos')}">${rows}</ol>${poll}
    ${conOn()?'':`<div class="A-why"><div><b>${r('Continua funcionando')}</b>${r('Minerar legendas, seleções, fotos e colar frases.')}</div><div><b>${r('Fica indisponível sem ela')}</b>${SEM_ELA}</div></div>`}
  </div>`;
}
function pollText(){
  if(S.con==='wait'||S.checking) return r('Conferindo agora…',true);
  return r(`Confere sozinho a cada 15 s · última vez há ${S.poll} s`,true);
}

/* ================= B · IGUAL ÀS BOAS-VINDAS (TRAVADA) ================= */
// Toda a cópia da B vem do catálogo (ONB-16, ONB-08, ONB-04, ONB-03, ENV-01, BRG-01/02).
// O Anki não é lido antes da Conexão: o passo 1 espera por ela e vira ✓ junto.
const B_STEPS=[
  {t:'ONB-16.passo1Titulo',lead:'ONB-08.passo1',done:()=>conOn()},
  {t:'ONB-16.passo2Titulo',lead:'ONB-08.passo2',done:()=>conOn()},
  {t:'ONB-16.passo3Titulo',lead:'ONB-08.passo3',done:()=>conOn()},
];
function bCurrent(){ const i=B_STEPS.findIndex(s=>!s.done()); return i<0?B_STEPS.length:i; }
function pollTextB(){
  if(S.con==='wait'||S.checking) return v('ONB-16.conferindoAgora');
  return v('ONB-16.conferindo',{segundos:S.poll});
}
function B(){
  const k=S.bStep??(S.con==='wait'?2:bCurrent());
  const wait=S.con==='wait';
  const list=B_STEPS.map((s,i)=>{
    const mk=s.done()?`<span class="mark ok">${IC.check}</span>`:`<span class="mark${i===k?' cur2':''}">${i+1}</span>`;
    return `<li><button data-bgo="${i}" ${i===k?'aria-current="step"':''}>${mk}${v(s.t)}</button></li>`;
  }).join('');
  const conStatus=wait?`<span class="dot wait"></span>${v('BRG-02')}`:conOn()?`<span class="dot"></span>${v('BRG-01.ligada')}`:`<span class="dot off"></span>${v('BRG-01.desligada')}`;
  let card;
  if(k>=B_STEPS.length||celebrating()){
    card=`<div class="kicker">${v('ONB-16.pronto')}</div><h2>${v('BRG-01.ligada')}</h2><p class="lead">${v('ONB-16.prontoApoio')}</p>
      <div class="ctrl"><span class="status"><span class="dot"></span>${v('BRG-01.ligada')}</span></div>`;
  } else {
    const s=B_STEPS[k];
    const status={
      0:`<span class="status muted">${wait?`<span class="dot wait"></span>${v('BRG-02')}`:`<span class="dot wait" style="animation:none"></span>${v('ONB-16.esperando')}`}</span>`,
      1:`<span class="status">${conStatus}</span>${comandos()}`,
      2:`<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span class="status">${conStatus}</span><button class="btn sm primary" data-retry style="margin-left:auto" ${wait?'disabled':''}>${v('ENV-01.tentarDeNovo')}</button></div>`,
    }[k];
    card=`<div class="kicker">${v('ONB-16.passos')} · ${v('ONB-03.passo',{n:k+1,total:3})}</div><h2>${v(s.t)}</h2>
      <p class="lead">${v(s.lead)}</p><div class="ctrl">${status}</div>
      <div class="wfoot">${k>0?`<button class="btn" data-bgo="${k-1}">${v('ONB-04.voltar')}</button>`:''}<span class="grow"></span>${k<2?`<button class="btn primary" data-bgo="${k+1}">${v('ONB-04.continuar')}</button>`:''}</div>`;
  }
  const foot=conOn()?'':`<div class="B-foot"><div class="A-poll">${S.checking||wait?'<span class="spinner" style="width:12px;height:12px"></span>':'<span class="dot wait"></span>'}<span id="poll-t">${pollTextB()}</span></div>
    <div class="A-why"><div><b>${v('ONB-16.continuaTitulo')}</b>${v('ONB-16.continua')}</div><div><b>${v('ONB-16.indisponivelTitulo')}</b>${v('ONB-16.indisponivel')}</div></div></div>`;
  return `<div class="first"><div class="B-top"><h2 class="t">${conOn()?v('BRG-01.ligada'):v('ONB-16.titulo')}</h2>${conOn()?'':`<p class="lead" style="margin:0">${v('ONB-16.apoio')}</p>`}</div>
    <div class="B-grid"><ol class="B-list" aria-label="${v('ONB-16.passos')}">${list}</ol><div class="B-card">${card}</div></div>${foot}</div>`;
}

/* ================= C · CAMINHO ILUSTRADO ================= */
function C(){
  const w=S.con==='wait',ok=conOn();
  const ankiOk=S.anki||ok;
  const nodes=[
    {cls:'ok',ic:IC.frases,t:'Suas frases',s:'1.284 no histórico',tag:r('guardadas'),badge:IC.check},
    {cls:ok?'ok':w?'wait':'miss',ic:IC.plug,t:'Conexão com o Anki',s:r('neste computador'),tag:ok?r('ligada'):w?r('conferindo…'):r('falta'),badge:ok?IC.check:w?'':'!'},
    {cls:ankiOk?'ok':'idle',ic:IC.cards,t:'Anki',s:r('seus baralhos'),tag:ankiOk?r('aberto'):r('fechado'),badge:ankiOk?IC.check:''},
  ];
  const node=n=>`<div class="node ${n.cls}"><div class="disc">${n.ic}${n.badge?`<span class="badge">${n.badge}</span>`:''}</div><b>${n.t}</b><small>${n.s}</small><span class="tag">${n.tag}</span></div>`;
  const l1=ok?'ok':w?'flow':'cut', l2=ok?'ok':w&&ankiOk?'flow':ankiOk?'cut':'';
  let fix;
  if(ok){
    fix=`<div class="C-fix okk"><span class="n">${IC.check}</span><div><b>${v('BRG-01.ligada')}</b><p>${r('As abas voltam em seguida.',true)}</p></div></div>`;
  } else {
    const falta=[];
    if(!ankiOk) falta.push(['Abra o Anki',v('ONB-08.passo1')]);
    falta.push(['Ligue a Conexão com o Anki',v('ONB-08.passo2')]);
    fix=falta.map((f,i)=>`<div class="C-fix" style="margin-top:${i?8:0}px"><span class="n">${i+1}</span><div><b>${r(f[0])}</b><p>${f[1]}</p>${i===falta.length-1?comandos():''}</div></div>`).join('');
  }
  return `<div class="first C"><h2 class="t">${ok?v('BRG-01.ligada'):v('ONB-16.titulo')}</h2>
    <p class="lead">${ok?r('Suas frases já podem virar cartões.',true):r('Suas frases estão guardadas. Para virarem cartões, falta a peça do meio.',true)}</p>
    <div class="C-path" role="img" aria-label="Caminho: suas frases, Conexão com o Anki, Anki">${node(nodes[0])}<div class="link ${l1}"></div>${node(nodes[1])}<div class="link ${l2}"></div>${node(nodes[2])}</div>
    ${fix}
    ${ok?'':`<p class="C-foot">${SEM_ELA}</p>`}</div>`;
}

/* ---------------- depois da primeira resposta: as abas voltam ---------------- */
function Tabs(){
  return `<nav class="seg" style="margin-bottom:16px" aria-label="Seções da Conexão com o Anki"><a href="#anki/custos" aria-current="page">Custos</a><a href="#anki/baralhos">Baralhos e termos</a><a href="#anki/vocabulario">Vocabulário</a><a href="#anki/ajustes">Ajustes de envio</a></nav>
   <div class="empty"><b>${v('BRG-22')}</b>Os custos aparecem aqui depois do primeiro envio ao Anki.<br><span style="font-size:11.5px">(o resto da área é o <a href="prototipo-anki.html?variant=C" style="color:var(--accent-text)">prototipo-anki.html</a>)</span></div>`;
}
const R={A,B,C};

/* ---------------- render ---------------- */
function render(){
  document.documentElement.dataset.theme=S.theme;
  document.body.classList.toggle('drafts',S.drafts);
  $('#sw-label').textContent=`${S.variant} · ${VARIANTS[S.variant]}`;
  const dot=$('#nav-dot');dot.className='dot'+(S.con==='off'?' off':S.con==='wait'?' wait':'');
  $('#nav-anki').title={on:v('BRG-01.ligada'),off:v('BRG-01.desligada'),wait:v('BRG-02')}[S.con];
  $('#anki-top').innerHTML=S.con==='off'?`<div class="banner" role="alert"><span class="dot off"></span><p>${v('ENV-01.aviso')}</p><button class="btn sm" data-retry>${v('ENV-01.tentarDeNovo')}</button></div>`
    :S.con==='wait'?`<div class="banner info"><span class="dot wait"></span><p>${v('BRG-02')}</p></div>`:'';
  $('#anki-body').innerHTML=conOn()&&S.phase==='tabs'?Tabs():R[S.variant]();
  const rail=S.win==='rail'||(S.win==='auto'&&innerWidth<1000);
  $('#app').classList.toggle('rail',rail);
  $('#s-cen').value=S.con==='on'?'on':S.con==='wait'?'wait':'nunca';
  readout();
}
function readout(){
  $('#readout').textContent=
`variante  ${S.variant} · ${VARIANTS[S.variant]}   tema ${S.theme}
conexão   ${S.con}   fase ${S.phase}
tentar    termina em: ${S.retry==='on'?'responde':'continua desligada'}
B passo   ${S.bStep??'(o primeiro que falta)'}`;
}
let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.add('hidden'),Math.max(1800,msg.length*70));}

/* ---------------- transições ---------------- */
let timers=[];const later=(fn,ms)=>timers.push(setTimeout(fn,ms));
function clearTimers(){timers.forEach(clearTimeout);timers=[];}
function ligar(){ // a conexão responde pela primeira vez
  S.con='on';S.anki=true;S.bStep=null;
  S.phase=S.variant==='A'?'reading':'celebrate';render();
  if(S.variant==='A') later(()=>{S.phase='celebrate';render();},1100);
  later(()=>{S.phase='tabs';render();toast(v('BRG-01.ligada'));},S.variant==='A'?2600:1800);
}
function tentar(outcome=S.retry){
  if(S.con==='wait')return;
  clearTimers();S.con='wait';S.bStep=null;render();
  later(()=>{if(outcome==='on')ligar();else{S.con='off';S.poll=0;render();}},1300);
}
function setCen(c,silent){
  clearTimers();S.bStep=null;
  if(c==='nunca'){S.anki=false;S.con='off';S.phase='first';}
  else if(c==='anki'){S.anki=true;S.con='off';S.phase='first';}
  else if(c==='wait'){S.con='wait';S.phase='first';}
  else if(c==='on'){ if(silent){S.con='on';S.anki=true;S.phase='tabs';} else ligar(); return; }
  if(!silent)render();
}

/* ---------------- variante e teclas ---------------- */
function setVariant(k){S.variant=k;S.bStep=null;try{const u=new URL(location);u.searchParams.set('variant',k);history.replaceState(null,'',u);}catch(e){}render();}
function cycle(d){const i=KEYS.indexOf(S.variant);setVariant(KEYS[(i+d+KEYS.length)%KEYS.length]);}
$('#sw-prev').onclick=()=>cycle(-1);$('#sw-next').onclick=()=>cycle(1);
addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea,select,[contenteditable]'))return;
  if(e.key==='ArrowLeft')cycle(-1);else if(e.key==='ArrowRight')cycle(1);
  else if(e.key==='t'||e.key==='T'){S.theme=S.theme==='dark'?'light':'dark';render();}
});
addEventListener('resize',render);

/* ---------------- interações ---------------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.closest('.proto'))return;
  if('retry' in b.dataset) tentar();
  else if('copiar' in b.dataset){toast(v('ONB-16.copiado'));}
  else if(b.dataset.bgo!=null){S.bStep=Math.min(+b.dataset.bgo,B_STEPS.length-1);render();}
});
document.addEventListener('toggle',e=>{const d=e.target.closest?.('details[data-det]');if(d)S.det[d.dataset.det]=d.open;},true);
$('#btn-atualizar').onclick=()=>{if(S.con!=='on')tentar();};
$('#s-cen').onchange=e=>setCen(e.target.value);
$('#s-retry').onchange=e=>{S.retry=e.target.value;readout();};
$('#s-auto').onclick=()=>{ // a conferência de 15 s do shell encontra a Conexão
  if(conOn())return;clearTimers();S.checking=true;render();
  later(()=>{S.checking=false;ligar();},900);
};
$('#s-reset').onclick=()=>setCen('nunca');
$('#s-drafts').onchange=e=>{S.drafts=e.target.checked;render();};
$('#s-win').onchange=e=>{S.win=e.target.value;render();};
// o relógio da conferência (só a linha da A é redesenhada, para não fechar o Detalhes)
setInterval(()=>{
  if(S.con!=='off'||S.checking)return;
  S.poll=(S.poll+1)%15;
  if(S.poll===0&&S.variant!=='C'){S.checking=true;render();later(()=>{S.checking=false;render();},900);return;}
  const t=document.getElementById('poll-t');if(t)t.innerHTML=S.variant==='B'?pollTextB():pollText();
},1000);

if(qs?.get('cen')) setCen(qs.get('cen'),true);
if(qs?.get('retry')==='on'){S.retry='on';$('#s-retry').value='on';}
if(qs?.get('lab')==='0') $('#lab').open=false;
render();
</script>
</body>
</html>
