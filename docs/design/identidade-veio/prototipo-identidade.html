<!DOCTYPE html>
<!--
  PROTÓTIPO DESCARTÁVEL — não é código de produção.
  Ticket wayfinder #3 "Identidade visual própria & design system base" (mapa #1).

  Pergunta: qual identidade (marca, paleta, tipografia, linguagem de componentes)
  o PerpetualMiner adota como fundação de todos os protótipos?

  Plano: quatro direções radicalmente diferentes, trocáveis via ?variant=A|B|C|D,
  mais ?variant=Z (lado a lado + veredito). ?theme=dark|light força o tema.
  Setas ← → trocam a direção; T alterna o tema.

  Conteúdo das telas segue a auditoria (#2): popup = cockpit de captura,
  componente único de feedback in-page, estados Enviada ao Anki / Exportada.
  Os textos são provisórios, porque o ticket "Voz, tom & catálogo" decide a redação final.
  Todas as fontes têm cirílico (medido na API do Google Fonts em 2026-09-14).
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PerpetualMiner · Identidade (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,500;1,7..72,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#0b0b0c;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
input,textarea,select{font:inherit}

/* ───────── Base (tudo lê tokens; cada direção sobrescreve estrutura abaixo) ───────── */
.sp{background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:13.5px;line-height:1.5;min-height:100vh;padding:28px 20px 120px;transition:background .2s,color .2s}
.wrap{max-width:1180px;margin:0 auto}
.muted{color:var(--muted)}
.sec{margin-top:52px}
.sec-h{margin:0 0 18px;display:flex;align-items:center;gap:10px}
.sec-sub{color:var(--muted);margin:-10px 0 18px;max-width:70ch}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;min-width:0}
.lbl{font-size:11.5px;color:var(--muted);margin:0 0 8px;font-weight:600;letter-spacing:.02em}
.note{font-size:12px;color:var(--muted);margin-top:10px}

/* Hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
.hero .mark{width:112px;height:112px;flex:none}
.hero-name{margin:0}
.hero-concept{margin:6px 0 0;color:var(--muted);max-width:62ch;font-size:14.5px}
.hero-tags{margin-top:12px}
@media (max-width:560px){.hero{grid-template-columns:1fr}}

/* Marca na barra */
.sizes{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap}
.sizes figure{margin:0;text-align:center;font-size:11px;color:var(--muted)}
.sizes figure svg,.sizes canvas{display:block;margin:0 auto 6px}
.px{image-rendering:pixelated;border:1px solid var(--border);border-radius:4px}
.chrome{border-radius:10px;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;font-size:12px;border:1px solid rgba(128,128,128,.25)}
.chrome .tabs{display:flex;gap:4px;padding:6px 8px 0}
.chrome .tab{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:8px 8px 0 0;min-width:0;max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chrome .bar{display:flex;align-items:center;gap:10px;padding:7px 10px}
.chrome .omni{flex:1;min-width:0;border-radius:999px;padding:6px 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chrome .ext{position:relative;width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.chrome .ext .badge{position:absolute;right:-3px;bottom:0;font:700 9px/1 'Segoe UI',system-ui,sans-serif;padding:2px 3px;border-radius:4px;min-width:14px;text-align:center}
.chrome .puzzle{width:16px;height:16px;opacity:.7}
.chrome.light{background:#dee1e6;color:#1f1f1f}.chrome.light .tab.on,.chrome.light .bar{background:#fff}.chrome.light .omni{background:#eef1f4;color:#444}
.chrome.dark{background:#1f2022;color:#e3e3e3}.chrome.dark .tab.on,.chrome.dark .bar{background:#35363a}.chrome.dark .omni{background:#202124;color:#bbb}

/* Paleta */
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:10px}
.sw div{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--surface);min-width:0}
.sw i{display:block;height:46px}
.sw b{display:block;font-size:11.5px;padding:6px 8px 0}
.sw code{display:block;font:11px var(--font-mono);color:var(--muted);padding:0 8px 7px;overflow:hidden;text-overflow:ellipsis}
.ctab{width:100%;border-collapse:collapse;font-size:12.5px}
.ctab td{padding:7px 6px;border-top:1px solid var(--border);vertical-align:middle}
.ctab .smp{padding:3px 8px;border-radius:4px;font-weight:600;white-space:nowrap}
.pass,.fail{font:700 10.5px var(--font-mono);padding:2px 6px;border-radius:4px;white-space:nowrap}
.pass{background:var(--success-soft);color:var(--success)}
.fail{background:var(--danger-soft);color:var(--danger)}

/* Tipografia */
.tscale>div{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:baseline;padding:9px 0;border-top:1px solid var(--border)}
.tscale code{font:11px var(--font-mono);color:var(--muted)}
.fam{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin-bottom:14px}
.fam>div{padding:14px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
.fam .aa{font-size:34px;line-height:1.1;margin:4px 0}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;font-weight:600;font-size:13px;border-radius:var(--r);border:1px solid transparent;cursor:pointer;white-space:nowrap;line-height:1.2;font-family:var(--font-ui)}
.btn svg{width:15px;height:15px;flex:none}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-secondary{background:var(--surface-2);color:var(--text);border-color:var(--border)}
.btn-ghost{background:transparent;color:var(--text)}
.btn-danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn-block{width:100%}
.btn-icon{width:30px;height:30px;padding:0;border-radius:var(--r-sm);background:transparent;color:var(--muted);border:1px solid transparent}
.btn-icon:hover{background:var(--surface-2);color:var(--text)}
.btn-icon.danger:hover{color:var(--danger)}
.btn:focus-visible,.btn-icon:focus-visible,.inp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Inputs */
.inp{background:var(--surface);color:var(--text);border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:8px 11px;min-width:0;width:100%;font-size:13px;font-family:var(--font-ui)}
.inp::placeholder{color:var(--muted)}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search{position:relative}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.search .inp{padding-left:32px}
textarea.inp{resize:vertical;min-height:58px}
.fields{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}

/* Toggle */
.tg{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.tg input{position:absolute;opacity:0;pointer-events:none}
.tg .trk{position:relative;width:34px;height:20px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border-strong);transition:.15s;flex:none}
.tg .trk::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:.15s}
.tg input:checked+.trk{background:var(--accent);border-color:var(--accent)}
.tg input:checked+.trk::after{left:16px;background:var(--accent-ink)}
.tg input:focus-visible+.trk{outline:2px solid var(--accent);outline-offset:2px}
.cb{accent-color:var(--accent);width:16px;height:16px;margin:0;flex:none}

/* Badges */
.bdg{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:var(--r-badge);background:var(--surface-2);color:var(--muted);white-space:nowrap;line-height:1.3}
.bdg svg{width:12px;height:12px}
.bdg.ok{background:var(--success-soft);color:var(--success)}
.bdg.info{background:var(--info-soft);color:var(--info)}
.bdg.bad{background:var(--danger-soft);color:var(--danger)}
.bdg .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.kbd{font:600 11px var(--font-mono);padding:2px 6px;border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:5px;background:var(--surface);color:var(--text)}

/* Frase */
.date-h{display:flex;align-items:center;gap:10px;font-size:11.5px;font-weight:700;color:var(--muted);margin:14px 0 8px;letter-spacing:.04em}
.date-h::after{content:"";flex:1;height:1px;background:var(--border)}
.ph{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:13px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;min-width:0}
.ph .cb{margin-top:3px}
.ph-text{font-family:var(--font-phrase);font-size:var(--phrase-size);line-height:1.5;overflow-wrap:anywhere}
.ph-meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
.ph-act{display:flex;gap:2px}
.kw{background:var(--kw-bg);color:var(--kw-fg);border-radius:3px;padding:0 2px;cursor:pointer}
.kwchip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:2px 4px 2px 8px;border-radius:var(--r-badge);border:1px dashed var(--border-strong);color:var(--text)}
.kwchip small{color:var(--muted);font-family:var(--font-mono);font-size:10.5px}
.kwchip button{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 3px}
.ph.done .ph-text{opacity:.62}
@media (max-width:520px){.ph{grid-template-columns:auto 1fr}.ph-act{grid-column:2}}

/* Barra contextual de seleção */
.selbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:9px 10px 9px 14px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--border)}
.selbar .count{font-weight:700;margin-right:auto}

/* Modal */
.scrim{background:var(--scrim);border-radius:var(--r-lg);padding:28px 16px;display:grid;place-items:center}
.modal{width:min(100%,440px);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:20px}
.modal h4{margin:0 0 4px;font-size:17px;font-family:var(--font-display)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stats div{background:var(--surface-2);border-radius:var(--r);padding:10px;text-align:center}
.stats b{display:block;font:700 22px var(--font-num)}
.stats span{font-size:11.5px;color:var(--muted)}
.modal .actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:16px}

/* Estado vazio */
.empty{text-align:center;padding:26px 16px;border:1px dashed var(--border-strong);border-radius:var(--r-lg)}
.empty svg{width:40px;height:40px}
.empty h5{margin:10px 0 4px;font-size:14.5px}
.empty p{margin:0 auto 12px;color:var(--muted);max-width:36ch;font-size:12.5px}

/* Feedback in-page (componente único, 3 variantes) */
.fb{display:flex;gap:11px;align-items:flex-start;width:min(100%,320px);padding:11px 13px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);font-family:var(--font-ui)}
.fb .ic{width:26px;height:26px;border-radius:var(--r-sm);display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent-text)}
.fb .ic svg{width:15px;height:15px}
.fb b{font-size:12.5px;display:block}
.fb p{margin:2px 0 0;font-size:12px;color:var(--muted);font-family:var(--font-phrase);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.fb .meta{margin-left:auto;font:600 11px var(--font-num);color:var(--muted);white-space:nowrap}

/* Popup (340px real) */
.pop{width:340px;max-width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);font-family:var(--font-ui);font-size:13px}
.pop-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
.pop-h svg{width:30px;height:30px}
.pop-b{padding:14px 16px;display:grid;gap:14px}
.pop .st{font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:7px;display:flex;align-items:center;gap:8px}
.am{display:grid;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:8px 10px}
.am-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.am-row .lim{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);justify-self:end}
.am-row .lim .inp{width:52px;padding:4px 6px;text-align:center}
.am-row .cnt{font:600 12px var(--font-num);min-width:64px;text-align:right}
.am-row .cnt small{color:var(--muted);font-weight:500}
.last{display:grid;gap:0;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.last div{padding:8px 10px;border-top:1px solid var(--border);min-width:0}
.last div:first-child{border-top:0}
.last p{margin:0;font-family:var(--font-phrase);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.last small{color:var(--muted);font-size:11px}
.pop-f{padding:10px 16px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* Overlay sobre vídeo */
.video{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:10px;overflow:hidden;background:radial-gradient(ellipse at 30% 40%,#3a3f4a 0,#1b1d22 55%,#0c0d10 100%)}
.video .scene{position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,170,90,.18),transparent 45%),linear-gradient(0deg,rgba(0,0,0,.55),transparent 40%)}
.video .sub{position:absolute;left:50%;bottom:13%;transform:translateX(-50%);width:84%;text-align:center;color:#fff;font:600 clamp(13px,2.1vw,20px)/1.35 Arial,sans-serif;text-shadow:0 0 4px #000,0 2px 2px #000}
.video .fab{position:absolute;right:3%;top:40%;width:46px;height:46px;border-radius:var(--fab-r);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.45);cursor:pointer}
.video .fab svg{width:46px;height:46px}
.video .fab .cntb{position:absolute;right:-6px;top:-6px;font:700 10.5px/1 var(--font-num);padding:3px 5px;border-radius:999px;background:var(--badge-bg);color:var(--badge-fg);box-shadow:0 0 0 2px rgba(0,0,0,.4)}
.video .fb{position:absolute;right:3%;top:5%}
@media (max-width:560px){.video .fb{display:none}}

/* ───────── Direção A · Veio (mineral: grafite + ouro) ───────── */
.v-A{--font-ui:'Manrope',system-ui,sans-serif;--font-display:'Manrope',system-ui,sans-serif;--font-phrase:'Manrope',system-ui,sans-serif;--font-mono:'JetBrains Mono',ui-monospace,monospace;--font-num:'JetBrains Mono',ui-monospace,monospace;--phrase-size:15px;--r:10px;--r-sm:8px;--r-lg:14px;--r-badge:6px;--fab-r:14px}
.v-A .sec-h{font-size:11.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.v-A .sec-h::before{content:"";width:9px;height:9px;background:var(--accent);transform:rotate(45deg);flex:none}
.v-A .hero-name{font:800 34px/1.05 var(--font-display);letter-spacing:-.03em}
.v-A .wm{font-weight:500;letter-spacing:-.02em}.v-A .wm b{font-weight:800}
.v-A .btn-primary{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 0 rgba(0,0,0,.25)}
.v-A .tg .trk::after{border-radius:2px;transform:rotate(45deg);width:11px;height:11px;top:3.5px;left:4px}
.v-A .tg input:checked+.trk::after{left:18px}
.v-A .ph{border-left:3px solid transparent}
.v-A .ph.sel{border-left-color:var(--accent)}
.v-A .selbar{border-left:3px solid var(--accent)}
.v-A .fb{border-left:3px solid var(--accent)}
.v-A .date-h{text-transform:uppercase;letter-spacing:.12em;font-size:10.5px}

/* ───────── F · Veio travado = A + marca-texto da B + cursor da C + arredondamento da D ───────── */
.v-F{--font-ui:'Manrope',system-ui,sans-serif;--font-display:'Manrope',system-ui,sans-serif;--font-phrase:'Manrope',system-ui,sans-serif;--font-mono:'JetBrains Mono',ui-monospace,monospace;--font-num:'JetBrains Mono',ui-monospace,monospace;--phrase-size:15px;--r:14px;--r-sm:10px;--r-lg:20px;--r-badge:999px;--fab-r:50%}
.v-F .sec-h{font-size:11.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.v-F .sec-h::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--accent);transform:rotate(45deg);flex:none}
.v-F .hero-name{font:800 34px/1.05 var(--font-display);letter-spacing:-.03em}
.v-F .wm{font-weight:500;letter-spacing:-.02em}.v-F .wm b{font-weight:800}
.v-F .wm .cur{display:inline-block;width:.46em;height:.92em;border-radius:2px;background:var(--accent);vertical-align:-.1em;margin-left:3px;animation:blink 1.1s steps(1) infinite}
.v-F .btn{border-radius:999px;padding:9px 16px}
.v-F .btn-primary{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 16px -8px var(--accent)}
.v-F .btn-icon{border-radius:50%}
.v-F .inp{border-radius:12px}
.v-F .tg .trk{width:40px;height:24px}
.v-F .tg .trk::after{width:18px;height:18px;top:2px;left:2px}
.v-F .tg input:checked+.trk::after{left:18px}
.v-F .kw{background:linear-gradient(transparent 50%,var(--kw-bg) 50%,var(--kw-bg) 94%,transparent 94%);color:var(--kw-fg);border-radius:0;padding:0 1px}
.v-F .ph.sel{border-color:color-mix(in srgb,var(--accent) 45%,var(--border));background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.v-F .selbar{border-radius:22px;padding:7px 7px 7px 18px}
.v-F .fb{border-radius:16px}
.v-F .fb .ic{border-radius:50%}
.v-F .stats div{border-radius:14px}
.v-F .scrim{border-radius:24px}
.v-F .date-h{text-transform:uppercase;letter-spacing:.12em;font-size:10.5px}
@media (prefers-reduced-motion:reduce){.wm .cur{animation:none}}

/* ───────── Direção B · Caderno (papel + tinta + marca-texto) ───────── */
.v-B{--font-ui:'Inter',system-ui,sans-serif;--font-display:'Literata',Georgia,serif;--font-phrase:'Literata',Georgia,serif;--font-mono:'JetBrains Mono',ui-monospace,monospace;--font-num:'Inter',system-ui,sans-serif;--phrase-size:16.5px;--r:4px;--r-sm:3px;--r-lg:6px;--r-badge:3px;--fab-r:50%}
.v-B .sec-h{font:italic 600 23px/1.2 var(--font-display);padding-bottom:10px;border-bottom:1px solid var(--border)}
.v-B .hero-name{font:600 38px/1.05 var(--font-display);letter-spacing:-.015em}
.v-B .wm{font-family:var(--font-display);font-weight:600}.v-B .wm i{font-weight:500}
.v-B .panel{box-shadow:none}
.v-B .btn-secondary{background:transparent;border-color:var(--text)}
.v-B .btn-ghost{text-decoration:underline;text-underline-offset:3px;padding-inline:4px}
.v-B .inp{border:0;border-bottom:1.5px solid var(--border-strong);border-radius:0;background:transparent;padding-inline:2px}
.v-B .inp:focus{box-shadow:0 1.5px 0 0 var(--accent)}
.v-B .search .inp{padding-left:26px}.v-B .search svg{left:2px}
.v-B textarea.inp{border:1.5px solid var(--border-strong);border-radius:3px;padding:8px 10px;background:var(--surface)}
.v-B .tg .trk{width:18px;height:18px;border-radius:3px;border-width:1.5px;background:var(--surface)}

function lum(hex) {
  const n = hex.replace('#', '');
  const [r, g, b] = [0, 2, 4].map(i => parseInt(n.slice(i, i + 2), 16) / 255).map(c => c <= .03928 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4);
  return .2126 * r + .7152 * g + .0722 * b;
}
function ratio(a, b) { const [x, y] = [lum(a), lum(b)].sort((m, n) => n - m); return (x + .05) / (y + .05); }

function rasterize(root) {
  root.querySelectorAll('canvas[data-logo]').forEach(cv => {
    const k = cv.dataset.logo, s = +cv.dataset.size;
    const svg = V[k].logo(s, 'r' + s).replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ');
    const img = new Image();
    img.onload = () => { const c = cv.getContext('2d'); c.clearRect(0, 0, s, s); c.drawImage(img, 0, 0, s, s); };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}

  p.set('variant', v);
  th ? p.set('theme', th) : p.delete('theme');
  history.replaceState(null, '', '?' + p);
  render();
}
function render() {
  const { v, th } = state();
  const lab = document.getElementById('lab'), thb = document.getElementById('theme');
  if (v === 'Z') {
    app.innerHTML = overview();
    app.querySelectorAll('[data-tok]').forEach(el => applyTokens(el, el.dataset.tok, V[el.dataset.tok].primary));
    lab.textContent = 'Z (Lado a lado + veredito)';
    thb.hidden = true;
    wireVerdict();
  } else {
    const theme = th || V[v].primary;
    app.innerHTML = `<div class="sp v-${v}">${specimen(v, theme)}</div>`;
    applyTokens(app.firstElementChild, v, theme);
    app.querySelectorAll('.ovl').forEach(el => applyTokens(el, v, 'dark'));
    rasterize(app);
    lab.textContent = v === 'F' ? 'F (Veio travado)' : `${v} (${V[v].name})`;
    thb.hidden = false;
    thb.textContent = theme === 'dark' ? '☾ Escuro' : '☀ Claro';
    document.title = `${V[v].name} · PerpetualMiner (protótipo)`;
  }
}
function step(d) { const { v } = state(); const i = ORDER.indexOf(v); go(ORDER[(i + d + ORDER.length) % ORDER.length]); }
function toggleTheme() { const { v, th } = state(); if (v === 'Z') return; const cur = th || V[v].primary; go(v, cur === 'dark' ? 'light' : 'dark'); }
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.getElementById('theme').onclick = toggleTheme;
addEventListener('keydown', e => {
  const t = e.target; if (t.closest && t.closest('input,textarea,select,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'ArrowRight') step(1);
  else if (e.key === 't' || e.key === 'T') toggleTheme();
});

function wireVerdict() {
  const f = document.getElementById('verdict');
  f.onsubmit = (e) => {
    e.preventDefault();
    const d = new FormData(f);
    const txt = `Veredito identidade (#3): base = ${d.get('base') || '—'}; tema = ${d.get('tema') || '—'}; roubar = ${d.get('roubar') || '—'}; obs = ${d.get('obs') || '—'}`;
    if (window.lavish && window.lavish.queuePrompt) {
      window.lavish.queuePrompt(txt, { tag: 'choice', text: txt, element: f, queueKey: 'identidade', data: { question: 'identidade', base: d.get('base'), tema: d.get('tema'), roubar: d.get('roubar'), obs: d.get('obs') } });
    }
    const out = document.getElementById('verdict-out'); out.hidden = false;
    out.textContent = (window.lavish ? 'Na fila, pronto para enviar ao agente:\n' : 'Copie e cole no chat:\n') + txt;
  };
}
render();
</script>
