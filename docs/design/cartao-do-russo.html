<section><h2>Iniciante</h2><div class="par"><figure><figcaption>Frente</figcaption><div class="card"><div class="frase"><span style="color: #ff8c42;">Она</span> <span style="color: #a855f7;">приходила</span> <span style="color: #22c55e;">вчера</span>, но меня не было дома.</div>
<span class="som">▶</span></div></figure><figure><figcaption>Verso</figcaption><div class="card"><div class="frase"><span style="color: #ff8c42;">Она</span> <span style="color: #a855f7;">приходила</span> <span style="color: #22c55e;">вчера</span>, но меня не было дома.</div>
<span class="som">▶</span>
<hr id=answer>
<div class="pronuncia">ona pri-ha-DI-la vtche-RÁ, no mi-NIÁ ni BI-la DO-ma</div>
<div class="literal"><span style="color: #ff8c42;">Ela</span> <span style="color: #a855f7;">vinha</span> <span style="color: #22c55e;">ontem</span>, mas de-mim não havia em-casa</div>
<div class="natural">Ela veio ontem, mas eu não estava em casa.</div>
<div class="cena">Alguém conta que uma visita não encontrou ninguém.</div>






<div class="imagem"><span class="imagem-de-exemplo">[a imagem do Cartão]</span></div></div></figure></div></section><section><h2>Intermediário</h2><div class="par"><figure><figcaption>Frente</figcaption><div class="card"><div class="frase">Она <span style="color: #a855f7;">при</span><span style="color: #22c55e;">ход</span><span style="color: #f59e0b;">и</span><span style="color: #f59e0b;">л</span><span style="color: #ef4444;">а</span> <span style="color: #22c55e;">вчер</span><span style="color: #ef4444;">а</span>, но меня не было <span style="color: #22c55e;">дом</span><span style="color: #ef4444;">а</span>.</div>
<span class="som">▶</span></div></figure><figure><figcaption>Verso</figcaption><div class="card">
<div class="pronuncia">pri-ha-DI-la</div>



<div class="palavra">приходила <span class="som">▶</span></div>
<div class="silaba">приходи́ла</div>
<div class="definicao">To come, to arrive on foot; in the past imperfective it means she used to come, or she came and left.</div>
<div class="cores"><span style="color: #a855f7;">при-</span> – arrival, movement towards a place<br><span style="color: #22c55e;">ход</span> – the idea of walking, going<br><span style="color: #f59e0b;">-и-л-</span> – verb stem and past tense; imperfective aspect<br><span style="color: #ef4444;">-а</span> – feminine singular: she (3rd person, past tense)</div>
<div class="exemplo">Мама приходила домой поздно.</div>

<div class="imagem"><span class="imagem-de-exemplo">[a imagem do Cartão]</span></div></div></figure></div></section><section><h2>Avançado</h2><div class="par"><figure><figcaption>Frente</figcaption><div class="card"><div class="frase">Она приходила вчера, но меня не было дома.</div>
<span class="som">▶</span></div></figure><figure><figcaption>Verso</figcaption><div class="card">
<div class="palavra">приходила <span class="som">▶</span></div>
<div class="silaba">приходи́ла</div>
<div class="definicao">Приходить, то есть прибывать пешком; в прошедшем несовершенном это «она приходила обычно» или «она приходила и уходила».</div>
<div class="exemplo">Мама приходила домой поздно.</div>
<div class="raiz">ходить (идти пешком), вход (место, где входят), выход (место, где выходят)</div>
