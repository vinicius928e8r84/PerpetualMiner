<!DOCTYPE html>
<!--
  PROTÓTIPO DESCARTÁVEL — não é código de produção.
  Ticket wayfinder #7 "Protótipo: BookReader" (mapa #1).

  Pergunta: como fica o BookReader (foto → Gemini Vision → frases marcadas → adicionar)
  redesenhado na identidade Veio, com o keep/cut/regroup da auditoria (#2) aplicado?

  Plano: três layouts estruturalmente diferentes, trocáveis via ?variant=A|B|C, cada um
  percorrendo todos os estados (?state=...). Espelha o bookreader.html real: mesmos dados,
  mesmo fluxo, zero função nova além do "Cancelar" da lista fechada. O Gemini é simulado.
    A · Fiel      — a sidebar de hoje, revestida (chave Gemini sai; Título + Marcações ficam)
    B · Fluxo     — uma coluna só, etapas inline, barra de ação fixa embaixo
    C · Fotos × frases — duas colunas: fila de fotos com status por foto | frases agrupadas por foto
  Setas ← → trocam o layout; T alterna o tema. Todo texto é provisório (ticket Voz #4 decide).

  VEREDITO DO DONO (2026-09-14): layout C · Fotos × frases. Cancelar mantém as frases das fotos
  já lidas. "Recomeçar" pede confirmação quando há frases não adicionadas e "Tentar de novo" numa
  foto que falhou: os dois entram na lista fechada de ajustes. Botão final: "Adicionar N frases".
  A e B ficam aqui só como fonte primária; ?variant=C é o travado.
  Cópia alinhada ao catálogo aprovado da Voz (#4, FOT-01…18): nome “Minerar de uma foto”, verbo minerar.
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minerar de uma foto · PerpetualMiner (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ───────── Tokens Veio (spec #3) ───────── */
:root{
  --bg:#121110;--surface:#1B1A17;--surface-2:#262420;--border:#302D27;--border-strong:#736B5D;
  --text:#F2EEE6;--muted:#A89F90;--accent:#F5B83D;--accent-ink:#1A1204;--accent-text:#F5B83D;--accent-soft:rgba(245,184,61,.14);
  --success:#6FCF8E;--success-soft:rgba(111,207,142,.12);--danger:#FF7A66;--danger-soft:rgba(255,122,102,.12);
  --info:#86BDF2;--info-soft:rgba(134,189,242,.12);--scrim:rgba(0,0,0,.55);--shadow:0 18px 40px -12px rgba(0,0,0,.6);
  --font-ui:'Manrope',system-ui,sans-serif;--font-mono:'JetBrains Mono',ui-monospace,monospace;
  --r:14px;--r-sm:10px;--r-in:12px;--r-lg:20px;
}
[data-theme=light]{
  --bg:#F7F4EE;--surface:#FFFFFF;--surface-2:#F0EBE1;--border:#E4DCCD;--border-strong:#968C79;
  --text:#1C1A16;--muted:#625B4F;--accent:#F0AE2E;--accent-ink:#1A1204;--accent-text:#855608;--accent-soft:rgba(240,174,46,.18);
  --success:#1F7A45;--success-soft:rgba(31,122,69,.10);--danger:#B42318;--danger-soft:rgba(180,35,24,.08);
  --info:#1D5FA8;--info-soft:rgba(29,95,168,.08);--scrim:rgba(40,30,10,.35);--shadow:0 18px 40px -16px rgba(60,40,10,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:400 13.5px/1.5 var(--font-ui);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono)}
.hidden{display:none!important}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Marca */
.mark{flex:none;display:block}
.wm{font-weight:500;letter-spacing:-.02em;white-space:nowrap}.wm b{font-weight:800}
.wm .cur{display:inline-block;width:.46em;height:.92em;border-radius:2px;background:var(--accent);vertical-align:-.1em;margin-left:3px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.wm .cur{animation:none}}

/* Botões / campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;font-weight:700;font-size:13px;border-radius:999px;border:1px solid transparent;cursor:pointer;white-space:nowrap;line-height:1.2;background:none;transition:background .15s,opacity .15s}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 16px -8px var(--accent)}
.btn-secondary{background:var(--surface-2);color:var(--text);border-color:var(--border)}
.btn-ghost{color:var(--text)}
.btn-ghost:hover,.btn-secondary:hover{background:var(--surface-2)}
.btn-ok{background:var(--success-soft);color:var(--success);box-shadow:none}
.btn-lg{padding:12px 22px;font-size:14px}
.btn-icon{width:34px;height:34px;padding:0;border-radius:50%;display:inline-grid;place-items:center;background:transparent;border:1px solid var(--border);color:var(--text);cursor:pointer}
.btn-icon:hover{background:var(--surface-2)}
.btn:focus-visible,.btn-icon:focus-visible,.inp:focus-visible,.dz:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.link{color:var(--accent-text);font-weight:700;text-decoration:none;cursor:pointer;background:none;border:0;padding:0}
.link:hover{text-decoration:underline}
.inp{background:var(--surface);color:var(--text);border:1px solid var(--border-strong);border-radius:var(--r-in);padding:9px 12px;width:100%;min-width:0;font-size:13.5px}
.inp::placeholder{color:var(--muted)}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cb{accent-color:var(--accent);width:17px;height:17px;margin:0;flex:none;cursor:pointer}
.lbl{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;margin-bottom:9px}
.lbl::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--accent);transform:rotate(45deg);flex:none}
.hint{font-size:12px;color:var(--muted);margin-top:7px}

/* Badges */
.bdg{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap;line-height:1.3}
.bdg.ok{background:var(--success-soft);color:var(--success)}
.bdg.bad{background:var(--danger-soft);color:var(--danger)}
.bdg.acc{background:var(--accent-soft);color:var(--accent-text)}
.bdg .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.bdg.acc .dot{animation:blink 1.1s steps(1) infinite}

/* Marcações (legenda) */
.marks{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.marks li{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:center;font-size:12.5px;color:var(--muted)}
.marks .ex{font:600 12px var(--font-mono);color:var(--text);background:var(--surface-2);border-radius:8px;padding:3px 8px;text-align:center;white-space:nowrap}
.marks .ex u{text-decoration:underline wavy var(--accent);text-underline-offset:3px;font-family:var(--font-ui)}

/* Zona de fotos */
.dz{display:grid;place-items:center;text-align:center;gap:6px;border:1.5px dashed var(--border-strong);border-radius:var(--r-lg);padding:44px 20px;cursor:pointer;background:var(--surface);transition:border-color .15s,background .15s}
.dz:hover,.dz.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.dz .ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text);margin-bottom:6px}
.dz .ic svg{width:24px;height:24px}
.dz h3{font-size:16px;font-weight:700}
.dz p{font-size:12.5px;color:var(--muted)}
.dz-mini{display:flex;align-items:center;gap:10px;border:1.5px dashed var(--border-strong);border-radius:var(--r);padding:10px 12px 10px 14px;background:var(--surface);font-size:12.5px;color:var(--muted);cursor:pointer}
.dz-mini:hover{border-color:var(--accent)}
.dz-mini .grow{flex:1;min-width:0}
.dz-mini.busy{border-style:solid;border-color:color-mix(in srgb,var(--accent) 45%,var(--border));color:var(--text)}

/* Prévia */
.pv{position:relative;border-radius:var(--r-lg);overflow:hidden;background:#0c0b0a;border:1px solid var(--border);display:grid;place-items:center}
.pv img{display:block;max-width:100%;max-height:420px}
.pv .cap{position:absolute;left:12px;bottom:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pv .cap span{background:rgba(18,17,16,.82);color:#F2EEE6;font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;backdrop-filter:blur(6px)}

/* Progresso */
.prog{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .15s}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px}

/* Linhas de frase */
.rows{display:grid;gap:8px}
.fr{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);min-width:0;transition:opacity .15s}
.fr .cb{margin-top:3px}
.fr .tx{font-size:15px;line-height:1.5;overflow-wrap:anywhere;outline:none;border-radius:6px;padding:0 3px;margin:0 -3px}
.fr .tx:focus{box-shadow:0 0 0 2px var(--accent-soft);background:var(--surface-2)}
.fr .src{font:600 11px var(--font-mono);color:var(--muted);white-space:nowrap;margin-top:3px}
.fr.off{opacity:.5}
.fr.off .tx{text-decoration:line-through;text-decoration-color:var(--muted)}
.fr.saved{border-color:color-mix(in srgb,var(--success) 35%,var(--border))}
.fr.saved .src{color:var(--success)}
.fr.new{animation:none}
.grp{display:flex;align-items:center;gap:10px;font-size:10.5px;font-weight:800;color:var(--muted);margin:16px 0 8px;letter-spacing:.12em;text-transform:uppercase}
.grp::after{content:"";flex:1;height:1px;background:var(--border)}
.grp:first-child{margin-top:0}

/* Cabeçalho da lista (seleção igual à do painel: 1 checkbox) */
.lh{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:0 0 10px}
.lh .all{display:inline-flex;align-items:center;gap:9px;font-weight:700;cursor:pointer;user-select:none}
.lh .cnt{font:600 12px var(--font-mono);color:var(--muted)}
.lh .sp{flex:1}

/* Avisos / estados */
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:var(--r);font-size:12.5px;background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.note svg{margin-top:2px}
.note.bad{background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 30%,transparent)}
.note.bad svg{color:var(--danger)}
.note.info svg{color:var(--accent-text)}
.note b{font-weight:700}
.empty{text-align:center;padding:34px 18px;border:1px dashed var(--border-strong);border-radius:var(--r-lg);display:grid;justify-items:center;gap:6px}
.empty .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);margin-bottom:4px}
.empty.bad .ic{background:var(--danger-soft);color:var(--danger)}
.empty.acc .ic{background:var(--accent-soft);color:var(--accent-text)}
.empty .ic svg{width:22px;height:22px}
.empty h3{font-size:15px;font-weight:700}
.empty p{color:var(--muted);max-width:44ch;font-size:12.5px}
.empty .marks{margin-top:10px;text-align:left}
.stack{display:grid;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Toast (componente de feedback Veio) */
.toast{position:fixed;right:22px;bottom:84px;z-index:60;display:flex;gap:11px;align-items:center;padding:11px 14px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.toast .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--success-soft);color:var(--success);flex:none}
.toast b{font-size:13px}

/* ═════════ A · Fiel (sidebar revestida) ═════════ */
.A{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
.a-side{background:var(--surface);border-right:1px solid var(--border);padding:22px 20px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh;overflow:auto}
.a-brand{display:flex;gap:12px;align-items:center}
.a-brand .nm{font-size:17px;font-weight:800;letter-spacing:-.01em}
.a-brand .wm{font-size:12px;color:var(--muted)}
.a-foot{margin-top:auto}
.a-main{padding:34px clamp(16px,4vw,48px) 140px;max-width:900px;width:100%}
.a-main>header{margin-bottom:22px}
.a-main h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.a-main>header p{color:var(--muted);margin-top:4px}
.a-ld{display:grid;gap:12px;justify-items:center;text-align:center;padding:40px 24px}
.a-ld h2{font-size:17px;font-weight:700}
.a-ld .prog{width:min(100%,380px)}
.a-foot-save{position:sticky;bottom:16px;margin-top:16px;display:flex;justify-content:flex-end}
@media (max-width:760px){.A{grid-template-columns:1fr}.a-side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--border)}}

/* ═════════ B · Fluxo (uma coluna, barra fixa) ═════════ */
.B{min-height:100vh}
.b-top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:12px clamp(16px,3vw,28px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.b-top .nm{display:flex;flex-direction:column;line-height:1.2}
.b-top .nm>b{font-size:15px;font-weight:800}
.b-top .nm .wm{font-size:11.5px;color:var(--muted)}
.b-book{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0;flex:0 1 340px}
.b-book span{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.b-book .inp{border-radius:999px;padding:7px 14px}
.b-col{max-width:760px;margin:0 auto;padding:34px 16px 170px;display:grid;gap:16px}
.b-hero h1{font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
.b-hero p{color:var(--muted);margin-top:6px;max-width:58ch}
.b-status{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 16px;border-radius:var(--r-lg);background:var(--surface);border:1px solid color-mix(in srgb,var(--accent) 40%,var(--border))}
.b-status .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text)}
.b-status b{display:block;font-size:14px}
.b-status .prog{margin-top:8px}
.b-help{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);padding:0 14px}
.b-help summary{cursor:pointer;padding:11px 0;font-weight:700;font-size:13px;list-style:none;display:flex;align-items:center;gap:8px}
.b-help summary::-webkit-details-marker{display:none}
.b-help summary::after{content:"+";margin-left:auto;font:700 15px var(--font-mono);color:var(--muted)}
.b-help[open] summary::after{content:"–"}
.b-help .marks{padding:0 0 14px}
.b-bar{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);z-index:30;width:min(calc(100% - 32px),728px);display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 8px 8px 18px;border-radius:26px;background:var(--surface-2);border:1px solid var(--border);box-shadow:var(--shadow)}
.b-bar .all{display:inline-flex;align-items:center;gap:9px;font-weight:700;cursor:pointer}
.b-bar .cnt{font:600 12px var(--font-mono);color:var(--muted)}
.b-bar .sp{flex:1}

/* ═════════ C · Fotos × frases (duas colunas) ═════════ */
.C{display:grid;grid-template-rows:auto 1fr;min-height:100vh}
.c-top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding:12px clamp(16px,3vw,24px);border-bottom:1px solid var(--border);background:var(--surface)}
.c-top .nm>b{font-size:15px;font-weight:800;display:block;line-height:1.2}
.c-top .nm .wm{font-size:11.5px;color:var(--muted)}
.c-book{flex:1 1 280px;max-width:460px;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:10px}
.c-book span{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.c-top .back{margin-left:auto}
.c-body{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:0}
.c-photos{border-right:1px solid var(--border);padding:18px 16px 140px;display:flex;flex-direction:column;gap:12px;background:color-mix(in srgb,var(--surface) 45%,var(--bg))}
.c-ph-h{display:flex;align-items:center;gap:8px}
.c-ph-h .lbl{margin:0}
.c-ph-h .sp{flex:1}
.pc{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding:8px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);min-width:0}
.pc img{width:52px;height:68px;object-fit:cover;border-radius:8px;display:block;background:#0c0b0a}
.pc .nm{font:600 12px var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .why{font-size:11.5px;color:var(--danger);margin-top:4px;line-height:1.35}
.pc.lendo{border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
.pc.cancelada img,.pc.fila img{opacity:.55}
.c-legend{margin-top:auto;padding-top:14px;border-top:1px solid var(--border)}
.c-fr{padding:18px clamp(16px,3vw,32px) 150px;min-width:0;display:flex;flex-direction:column;gap:12px}
.C .fr:not(.saved) .src{display:none}
.c-save{position:sticky;bottom:74px;display:flex;justify-content:flex-end;margin-top:8px}
@media (max-width:820px){.c-body{grid-template-columns:1fr}.c-photos{border-right:0;border-bottom:1px solid var(--border);padding-bottom:18px}.c-legend{margin-top:0}}

/* ───────── Switcher (fora do design avaliado) ───────── */
.scrim{position:fixed;inset:0;z-index:70;background:var(--scrim);display:grid;place-items:center;padding:16px}
.modal{width:min(100%,440px);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:22px}
.modal h3{font-size:17px;font-weight:800}
.pm-sw{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:99;display:flex;align-items:center;gap:4px;background:#fff;color:#111;border:2px solid #111;border-radius:999px;padding:4px;box-shadow:0 10px 30px rgba(0,0,0,.45);font:600 12.5px/1 system-ui,sans-serif;max-width:calc(100vw - 16px);flex-wrap:nowrap;overflow-x:auto}
.pm-sw button,.pm-sw select{border:0;background:#111;color:#fff;border-radius:999px;height:30px;min-width:30px;padding:0 11px;cursor:pointer;font:700 12.5px system-ui,sans-serif;flex:none}
.pm-sw select{background:#e9e9ee;color:#111;max-width:210px}
.pm-sw .lab{padding:0 10px;white-space:nowrap}
.pm-sw .alt{background:#e9e9ee;color:#111}
.pm-sw .go{background:#F5B83D;color:#1A1204}

/* Veredito (painel de decisão) */
.vd{position:fixed;top:12px;right:12px;bottom:66px;z-index:98;width:min(420px,calc(100vw - 24px));background:#fff;color:#111;border:2px solid #111;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.5);font:14px/1.45 system-ui,sans-serif;display:flex;flex-direction:column}
.vd header{padding:14px 16px;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:8px}
.vd header b{font-size:15px}
.vd header button{margin-left:auto;border:0;background:#eee;border-radius:999px;width:28px;height:28px;cursor:pointer}
.vd form{padding:12px 16px 16px;overflow:auto;display:grid;gap:14px}
.vd fieldset{border:1px solid #ddd;border-radius:12px;padding:10px 12px;margin:0}
.vd legend{font-weight:700;padding:0 4px}
.vd label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}
.vd label small{display:block;color:#666}
.vd textarea{width:100%;min-height:80px;border:1px solid #bbb;border-radius:10px;padding:8px}
.vd .send{background:#111;color:#fff;border:0;border-radius:999px;padding:11px 16px;font-weight:700;cursor:pointer}
.vd .sent{background:#eaf6ee;border:1px solid #9bd3ad;border-radius:10px;padding:8px 10px;font-size:13px}
.vd pre{white-space:pre-wrap;background:#f5f5f5;border-radius:8px;padding:8px;font-size:12px;margin:0}
</style>
</head>
<body>
<div id="app"></div>

<div class="pm-sw" role="toolbar" aria-label="Protótipo: trocar layout e estado">
  <button id="prev" aria-label="Layout anterior">←</button>
  <span class="lab" id="lab"></span>
  <button id="next" aria-label="Próximo layout">→</button>
  <select id="st" aria-label="Pular para um estado"></select>
  <button class="alt" id="theme" aria-label="Alternar tema"></button>
  <button class="go" id="vdbtn">Veredito</button>
</div>

<aside class="vd hidden" id="vd" aria-label="Veredito do protótipo">
  <header><b>Veredito · Foto de livro</b><button id="vdclose" aria-label="Fechar">✕</button></header>
  <form id="vdform" data-lavish-question="bookreader-veredito">
    <fieldset><legend>1. Qual layout?</legend>
      <label><input type="radio" name="layout" value="A · Fiel (sidebar revestida)"><span>A · Fiel<small>A sidebar de hoje, revestida. Menor mudança.</small></span></label>
      <label><input type="radio" name="layout" value="B · Fluxo (uma coluna + barra fixa)"><span>B · Fluxo<small>Uma coluna só, etapas inline, barra de ação fixa.</small></span></label>
      <label><input type="radio" name="layout" value="C · Fotos × frases (duas colunas)"><span>C · Fotos × frases<small>Fila visível com status por foto, frases agrupadas por foto.</small></span></label>
      <label><input type="radio" name="layout" value="mistura (ver notas)"><span>Mistura<small>Diga nas notas o que pega de cada um.</small></span></label>
    </fieldset>
    <fieldset><legend>2. “Cancelar” no meio do lote</legend>
      <label><input type="radio" name="cancel" value="mantém as frases das fotos já lidas" checked><span>Mantém o que já foi lido<small>Para as fotos restantes; as frases das fotos prontas ficam na lista. (recomendado)</small></span></label>
      <label><input type="radio" name="cancel" value="descarta tudo do lote"><span>Descarta o lote inteiro<small>Volta ao estado de antes do lote.</small></span></label>
    </fieldset>
    <fieldset><legend>3. “Recomeçar” (Trocar Foto + Limpar Lista) com frases não adicionadas</legend>
      <label><input type="radio" name="recomecar" value="sem confirmação, como hoje" checked><span>Sem confirmação, como hoje<small>Respeita a lista fechada.</small></span></label>
      <label><input type="radio" name="recomecar" value="pede confirmação (entra na lista fechada)"><span>Pede confirmação<small>Seria o 6º item da lista fechada.</small></span></label>
    </fieldset>
    <fieldset><legend>4. Verbo do botão final (insumo p/ Voz)</legend>
      <label><input type="radio" name="verbo" value="Adicionar N frases" checked><span>Adicionar 12 frases<small>Casa com “Adicionar frases → Foto de livro”.</small></span></label>
      <label><input type="radio" name="verbo" value="Salvar N frases"><span>Salvar 12 frases</span></label>
      <label><input type="radio" name="verbo" value="Minerar N frases"><span>Minerar 12 frases</span></label>
    </fieldset>
    <label style="display:block">Notas (o que muda, o que pega de cada layout)<textarea name="notas"></textarea></label>
    <button class="send" type="submit">Enviar veredito</button>
    <div id="vdout"></div>
  </form>
</aside>

<script>
'use strict';
/* ═══════════ Dados simulados ═══════════ */
const POOL = [
  "Above all, don't lie to yourself.",
  "The mystery of human existence lies not in just staying alive, but in finding something to live for.",
  "Love in action is a harsh and dreadful thing compared with love in dreams.",
  "What is hell? I maintain that it is the suffering of being unable to love.",
  "Главное, самому себе не лгите.",
  "The more I love humanity in general, the less I love man in particular.",
  "People talk sometimes of bestial cruelty, but that's a great injustice to beasts.",
  "Что есть ад? Страдание о том, что нельзя уже более любить.",
  "I think if the devil doesn't exist, but man has created him, he has created him in his own image and likeness.",
  "Much unhappiness has come into the world because of bewilderment and things left unsaid.",
  "It's not God that I don't accept, only I most respectfully return Him the ticket.",
  "Be not ashamed of men's sins; love a man even in his sin.",
];
const WHY = {
  chave: 'A chave do Gemini não funciona. Confira em Configurações.',
  cota: 'O Gemini está recebendo pedidos demais; espere um minuto e tente de novo.',
  rede: 'Sem conexão com a internet. Confira a rede e tente de novo.',
};

function pageSVG(seed) {
  let r = seed * 9301 + 49297; const rnd = () => ((r = (r * 9301 + 49297) % 233280) / 233280);
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400"><rect width="300" height="400" fill="#2a2622"/><g transform="rotate(${(rnd() * 4 - 2).toFixed(1)} 150 200)"><rect x="18" y="14" width="264" height="372" rx="3" fill="#EFE6D3"/>`;
  for (let y = 44, i = 0; y < 360; y += 15, i++) {
    const w = 170 + rnd() * 60, gap = rnd() > .85;
    if (gap) continue;
    s += `<rect x="36" y="${y}" width="${w.toFixed(0)}" height="5" rx="2" fill="#8E8472"/>`;
    if ((i + seed) % 7 === 2) s += `<path d="M36 ${y + 9} q 20 3 40 0 t 40 0 t 40 0 t ${(w - 120).toFixed(0)} 0" stroke="#2F4E9A" stroke-width="1.6" fill="none"/>`;
    if ((i + seed) % 9 === 5) s += `<path d="M31 ${y + 9} l6 -12 M${(36 + w + 4).toFixed(0)} ${y + 9} l6 -12" stroke="#333" stroke-width="1.6"/>`;
  }
  s += `<text x="150" y="376" font-family="Georgia" font-size="10" text-anchor="middle" fill="#8E8472">${120 + seed}</text></g></svg>`;
  return 'data:image/svg+xml,' + encodeURIComponent(s);
}

/* ═══════════ Estado ═══════════ */
let S, seq, poolIdx, runTok = 0, toastT;
function fresh() {
  runTok++;
  seq = 0; poolIdx = 0;
  S = { hasKey: true, view: 'upload', title: 'The Brothers Karamazov', photos: [], frases: [], cancelled: false, toast: null, confirm: false };
}
function mkPhoto(status, extra = {}) {
  seq++;
  return { id: seq, name: `IMG_${2040 + seq}.jpg`, img: pageSVG(seq), status, found: 0, why: null, ...extra };
}
function takePhrases(photo, n) {
  for (let k = 0; k < n; k++) {
    S.frases.push({ id: S.frases.length + 1, text: POOL[poolIdx % POOL.length], photo: photo.id, on: true, saved: false });
    poolIdx++;
  }
  photo.found = n; photo.status = 'ok';
}
function script(p) { // resultado simulado de cada foto em free play
  if (p.retried) return { n: 2 };
  if (p.id % 6 === 4) return { erro: 'cota' };
  if (p.id % 7 === 5) return { n: 0 };
  return { n: 2 + (p.id % 3) };
}

/* ═══════════ Motor simulado ═══════════ */
function pump() {
  if (S.photos.some(p => p.status === 'lendo')) return;
  const next = S.photos.find(p => p.status === 'fila');
  if (!next) { if (S.view === 'lendo') S.view = 'resultados'; render(); return; }
  next.status = 'lendo'; render();
  const tok = runTok;
  setTimeout(() => {
    if (tok !== runTok) return;
    const res = script(next);
    if (res.erro) { next.status = 'erro'; next.why = WHY[res.erro]; } else takePhrases(next, res.n);
    pump();
  }, 1300);
}
function addPhotos(n) {
  if (!S.hasKey) return;
  const arr = Array.from({ length: n }, () => mkPhoto('pronta'));
  if (S.view === 'upload') {
    S.photos.push(...arr);
    if (n === 1) { S.view = 'previa'; render(); }       // 1 foto: prévia antes de ler (como hoje)
    else startBatch();                                    // várias: pula a prévia (como hoje)
  } else if (S.view === 'previa') {
    S.photos.push(...arr); render();                      // soma na fila da prévia (como hoje)
  } else {
    arr.forEach(p => p.status = 'fila'); S.photos.push(...arr);
    if (S.view === 'resultados') pump(); else render();  // em leitura: entra na fila
  }
}
function startBatch() {
  S.view = 'lendo'; S.cancelled = false;
  S.photos.forEach(p => { if (p.status === 'pronta') p.status = 'fila'; });
  pump();
}
function cancelBatch() {
  runTok++;
  S.photos.forEach(p => { if (p.status === 'fila' || p.status === 'lendo') p.status = 'cancelada'; });
  S.cancelled = true; S.view = 'resultados'; render();
}
function retry(id) {
  const p = S.photos.find(x => x.id === id); p.status = 'fila'; p.why = null; p.retried = true;
  if (S.view === 'resultados') pump(); else render();
}
function askRestart() {
  if (S.frases.some(f => !f.saved && f.text.trim())) { S.confirm = true; render(); } else restart();
}
function restart() { const t = S.title, k = S.hasKey; fresh(); S.title = t; S.hasKey = k; render(); }
function save() {
  const sel = S.frases.filter(f => f.on && !f.saved && f.text.trim());
  if (!sel.length) return;
  sel.forEach(f => f.saved = true);
  showToast(`${sel.length} ${plural(sel.length, 'frase minerada', 'frases mineradas')}`);
  render();
}
function showToast(msg) { S.toast = msg; clearTimeout(toastT); toastT = setTimeout(() => { S.toast = null; render(); }, 3200); }

/* ═══════════ Estados-atalho (snapshots p/ revisão) ═══════════ */
const STATES = {
  semchave:   ['Sem chave Gemini', () => { S.hasKey = false; }],
  inicio:     ['Início', () => {}],
  previa:     ['Prévia (1 foto)', () => { S.photos.push(mkPhoto('pronta')); S.view = 'previa'; }],
  lendo:      ['Lendo lote (3 de 5)', () => { const a = mkPhoto('ok'), b = mkPhoto('ok'); takePhrases(a, 3); takePhrases(b, 2); S.photos.push(a, b, mkPhoto('lendo'), mkPhoto('fila'), mkPhoto('fila')); S.view = 'lendo'; }],
  resultados: ['Resultados', () => { [3, 4, 2].forEach(n => { const p = mkPhoto('ok'); S.photos.push(p); takePhrases(p, n); }); S.frases[2].on = false; S.frases[6].on = false; S.view = 'resultados'; }],
  mais:       ['Resultados + lendo mais', () => { [3, 2].forEach(n => { const p = mkPhoto('ok'); S.photos.push(p); takePhrases(p, n); }); S.photos.push(mkPhoto('lendo'), mkPhoto('fila')); S.view = 'resultados'; }],
  parcial:    ['Uma foto falhou', () => { const a = mkPhoto('ok'); takePhrases(a, 3); const b = mkPhoto('erro', { why: WHY.cota }); const c = mkPhoto('ok'); takePhrases(c, 2); S.photos.push(a, b, c); S.view = 'resultados'; }],
  vazio:      ['Nenhuma marcação achada', () => { const p = mkPhoto('ok'); S.photos.push(p); takePhrases(p, 0); S.view = 'resultados'; }],
  falha:      ['Gemini falhou em tudo', () => { S.photos.push(mkPhoto('erro', { why: WHY.chave }), mkPhoto('erro', { why: WHY.chave })); S.view = 'resultados'; }],
  cancelado:  ['Cancelado no meio', () => { const a = mkPhoto('ok'), b = mkPhoto('ok'); takePhrases(a, 3); takePhrases(b, 2); S.photos.push(a, b, mkPhoto('cancelada'), mkPhoto('cancelada'), mkPhoto('cancelada')); S.cancelled = true; S.view = 'resultados'; }],
  salvo:      ['Frases mineradas', () => { [3, 4].forEach(n => { const p = mkPhoto('ok'); S.photos.push(p); takePhrases(p, n); }); S.frases[1].on = false; S.frases.forEach(f => { if (f.on) f.saved = true; }); S.view = 'resultados'; }],
};

/* ═══════════ Helpers de render ═══════════ */
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const plural = (n, a, b) => n === 1 ? a : b;
const I = {
  photo: '<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  back: '<path d="m15 18-6-6 6-6"/>',
  scan: '<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  redo: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  key: '<circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.8-9.8M17 6l3 3M14.5 8.5l2 2"/>',
  alert: '<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/>',
  book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/>',
};
const ic = (k, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${I[k]}</svg>`;
const logo = s => `<svg class="mark" width="${s}" height="${s}" viewBox="0 0 128 128" aria-hidden="true"><rect width="128" height="128" rx="28" fill="#1B1A17"/><polygon points="64,14 64,114 38,92 38,36" fill="#FFD27A"/><polygon points="64,14 90,36 90,92 64,114" fill="#D9901A"/><polygon points="64,14 90,36 64,46 38,36" fill="#FFE3A6"/><rect x="30" y="68" width="68" height="10" fill="#1B1A17"/></svg>`;
const wm = () => `<span class="wm">Perpetual<b>Miner</b><span class="cur"></span></span>`;

const COPY = {
  nome: 'Minerar de uma foto',
  sub: 'Tire uma foto da página com os trechos marcados e escolha quais frases minerar.',
};
const legend = () => `<ul class="marks">
  <li><span class="ex">/texto/</span>entre barras</li>
  <li><span class="ex">_texto_</span>entre underscores</li>
  <li><span class="ex"><u>texto</u></span>sublinhado à mão</li>
  <li><span class="ex">[texto]</span>colchetes, círculo ou traço na margem</li></ul>`;
const titleInput = (extra = '') => `<input class="inp" data-bind="title" value="${esc(S.title)}" placeholder="Ex.: Atomic Habits" aria-label="Título do livro" ${extra}>`;

function counts() {
  const pend = S.frases.filter(f => !f.saved);
  const sel = pend.filter(f => f.on);
  const reading = S.photos.filter(p => p.status === 'lendo' || p.status === 'fila');
  const done = S.photos.filter(p => ['ok', 'erro', 'cancelada'].includes(p.status));
  return { pend, sel, reading, done, total: S.photos.length, saved: S.frases.filter(f => f.saved).length };
}

function statusBadge(p) {
  switch (p.status) {
    case 'pronta': return `<span class="bdg">Pronta</span>`;
    case 'fila': return `<span class="bdg">Na fila</span>`;
    case 'lendo': return `<span class="bdg acc"><span class="dot"></span>Lendo…</span>`;
    case 'ok': return p.found ? `<span class="bdg ok">${p.found} ${plural(p.found, 'frase', 'frases')}</span>` : `<span class="bdg">Sem marcações</span>`;
    case 'erro': return `<span class="bdg bad">Falhou</span>`;
    case 'cancelada': return `<span class="bdg">Cancelada</span>`;
  }
}

function dropzone() {
  return `<div class="dz" data-act="pick" tabindex="0" role="button" aria-label="Escolher fotos">
    <div class="ic">${ic('photo')}</div>
    <h3>Arraste fotos de páginas marcadas</h3>
    <p>ou clique para escolher · JPG, PNG, HEIC ou WEBP</p>
    <button class="btn btn-ghost" data-act="pick4" style="font-size:12px;margin-top:4px">(simular lote de 4 fotos)</button>
  </div>`;
}
function miniDrop() {
  const { reading } = counts();
  const lendo = S.photos.find(p => p.status === 'lendo');
  if (lendo && S.view === 'resultados') {
    const fila = reading.length - 1;
    return `<div class="dz-mini busy" data-act="pick1">${ic('scan')}<span class="grow">Lendo <b class="mono">${lendo.name}</b>${fila ? ` · ${fila} ${plural(fila, 'foto', 'fotos')} na fila · arraste mais para ler em seguida` : ''}</span><span class="bdg acc"><span class="dot"></span>Lendo</span></div>`;
  }
  return `<div class="dz-mini" data-act="pick1">${ic('plus')}<span class="grow">Arraste mais páginas para somar à lista</span><button class="btn btn-secondary" data-act="pick1">Escolher</button></div>`;
}
function noKey() {
  return `<div class="empty acc"><div class="ic">${ic('key')}</div>
    <h3>Falta a chave do Gemini</h3>
    <p>Para ler fotos, adicione sua chave do Gemini em <b>Configurações</b>.</p>
    <div class="row" style="margin-top:8px;justify-content:center"><button class="btn btn-primary" data-act="cfg">${ic('key')}Abrir Configurações</button><button class="btn btn-ghost" data-act="givekey">(simular: chave salva)</button></div></div>`;
}
function preview(showActions = true) {
  const p = S.photos[0], n = S.photos.length;
  return `<div class="pv"><img src="${p.img}" alt="Prévia da foto ${esc(p.name)}">
      <div class="cap"><span>Confira se as marcações aparecem na foto</span>${n > 1 ? `<span class="mono">${n} fotos · mostrando a 1ª</span>` : ''}</div></div>
    ${showActions ? `<div class="row"><button class="btn btn-primary btn-lg" data-act="read">${ic('scan')}Ler marcações${n > 1 ? ` (${n} fotos)` : ''}</button><button class="btn btn-ghost" data-act="restart">${ic('redo')}Recomeçar</button><span class="muted" style="font-size:12px">Arraste mais fotos aqui para ler junto.</span></div>` : ''}`;
}
function progressInfo() {
  const { done, total } = counts();
  const cur = S.photos.find(p => p.status === 'lendo');
  const idx = cur ? S.photos.indexOf(cur) + 1 : done.length;
  return { cur, idx, total, pct: Math.round((done.length / Math.max(total, 1)) * 100), fila: S.photos.filter(p => p.status === 'fila').length, found: S.frases.length };
}
function photoNotes() {
  const errs = S.photos.filter(p => p.status === 'erro');
  const canc = S.photos.filter(p => p.status === 'cancelada');
  let h = '';
  if (errs.length && S.frases.length) h += `<div class="note bad">${ic('alert')}<div><b>Não deu para ler ${errs.length === 1 ? 'a foto ' + (S.photos.indexOf(errs[0]) + 1) : errs.length + ' fotos'}.</b> ${esc(errs[0].why)} <span class="muted">(${errs.map(p => p.name).join(', ')})</span></div></div>`;
  if (S.cancelled && canc.length) h += `<div class="note info">${ic('info')}<div><b>Leitura cancelada.</b> ${canc.length} ${plural(canc.length, 'foto ficou', 'fotos ficaram')} sem ler; as frases das fotos já lidas continuam aqui.</div></div>`;
  return h;
}
function outcomeEmpty() {
  if (S.frases.length) return '';
  const allErr = S.photos.length && S.photos.every(p => p.status === 'erro');
  if (allErr) return `<div class="empty bad"><div class="ic">${ic('alert')}</div><h3>Não deu para ler ${S.photos.length === 1 ? 'a foto' : 'as fotos'}</h3><p>${esc(S.photos[0].why)}</p><div class="row" style="justify-content:center;margin-top:6px"><button class="btn btn-secondary" data-act="cfg">${ic('key')}Abrir Configurações</button><button class="btn btn-ghost" data-act="restart">${ic('redo')}Recomeçar</button></div></div>`;
  if (S.cancelled) return `<div class="empty"><div class="ic">${ic('x')}</div><h3>Leitura cancelada</h3><p>Nenhuma foto chegou a ser lida.</p><div class="row" style="justify-content:center;margin-top:6px"><button class="btn btn-ghost" data-act="restart">${ic('redo')}Recomeçar</button></div></div>`;
  const n = S.photos.length;
  return `<div class="empty"><div class="ic">${ic('search')}</div><h3>Nenhuma marcação encontrada ${n > 1 ? 'nestas fotos' : 'nesta foto'}</h3><p>Marque as frases com /barras/, _sublinhado_ ou caneta e confira se aparecem na foto.</p>${legend()}<div class="row" style="justify-content:center;margin-top:10px"><button class="btn btn-ghost" data-act="restart">${ic('redo')}Recomeçar</button></div></div>`;
}
function row(f) {
  const cls = f.saved ? 'saved' : (f.on ? '' : 'off');
  const ph = S.photos.find(p => p.id === f.photo);
  return `<div class="fr ${cls}">
    <input type="checkbox" class="cb" data-act="tog" data-id="${f.id}" ${f.on ? 'checked' : ''} ${f.saved ? 'disabled' : ''} aria-label="Incluir frase ${f.id}">
    <div class="tx" contenteditable="${!f.saved}" spellcheck="false" data-edit="${f.id}">${esc(f.text)}</div>
    <span class="src">${f.saved ? '✓ minerada' : `foto ${S.photos.indexOf(ph) + 1}`}</span></div>`;
}
function rowsFlat() { return `<div class="rows">${S.frases.map(row).join('')}</div>`; }
function rowsByPhoto() {
  return S.photos.filter(p => p.status === 'ok' && p.found).map(p =>
    `<div class="grp">Foto ${S.photos.indexOf(p) + 1} · <span class="mono" style="letter-spacing:0;text-transform:none">${p.name}</span></div><div class="rows">${S.frases.filter(f => f.photo === p.id).map(row).join('')}</div>`).join('');
}
function selectAll() {
  const { pend, sel } = counts();
  const all = pend.length && sel.length === pend.length, some = sel.length && !all;
  return `<label class="all"><input type="checkbox" class="cb" data-act="all" ${all ? 'checked' : ''} ${some ? 'data-mixed="1"' : ''} ${pend.length ? '' : 'disabled'}>Selecionar todas</label>`;
}
function countLabel() {
  const { pend, sel, saved } = counts();
  const parts = [`${S.frases.length} ${plural(S.frases.length, 'frase encontrada', 'frases encontradas')}`];
  if (pend.length) parts.push(`${sel.length} ${plural(sel.length, 'selecionada', 'selecionadas')}`);
  if (saved) parts.push(`${saved} ${plural(saved, 'minerada', 'mineradas')}`);
  return `<span class="cnt">${parts.join(' · ')}</span>`;
}
function saveBtn(big = true) {
  const { sel, pend, saved } = counts();
  if (!pend.length && saved) return `<div class="row"><button class="link" data-act="painel">Ver no Painel →</button><button class="btn btn-primary ${big ? 'btn-lg' : ''}" disabled>${ic('plus')}Minerar frases</button></div>`;
  const n = sel.length;
  return `<button class="btn btn-primary ${big ? 'btn-lg' : ''}" data-act="save" ${n ? '' : 'disabled'}>${ic('plus')}${n ? `Minerar ${n} ${plural(n, 'frase', 'frases')}` : 'Selecione pelo menos uma frase'}</button>`;
}
function readingCard(inlineStyle) {
  const { cur, idx, total, pct, fila, found } = progressInfo();
  if (inlineStyle === 'B') return `<div class="b-status"><div class="ic">${ic('scan')}</div><div><b>Lendo a foto ${idx} de ${total}…</b><span class="muted" style="font-size:12px"><span class="mono">${cur ? cur.name : ''}</span> · ${found} ${plural(found, 'frase', 'frases')} até agora${fila ? ` · ${fila} na fila` : ''}</span><div class="prog"><i style="width:${pct}%"></i></div></div><button class="btn btn-secondary" data-act="cancel">${ic('x')}Cancelar</button></div>`;
  return `<div class="card a-ld"><div class="bdg acc"><span class="dot"></span>Gemini</div>
    <h2>${total > 1 ? `Lendo a foto ${idx} de ${total}…` : 'Lendo a foto…'}</h2>
    <p class="muted">Procurando os trechos marcados${cur && total > 1 ? ` · <span class="mono">${cur.name}</span>` : ''}.</p>
    ${total > 1 ? `<div class="prog"><i style="width:${pct}%"></i></div><p class="mono muted" style="font-size:12px">${found} ${plural(found, 'frase', 'frases')} até agora${fila ? ` · ${fila} na fila` : ''}</p>` : ''}
    <button class="btn btn-secondary" data-act="cancel" style="margin-top:6px">${ic('x')}Cancelar</button>
    <p class="muted" style="font-size:12px">Pode arrastar mais fotos para a fila.</p></div>`;
}

/* ═══════════ Layout A · Fiel ═══════════ */
function VA() {
  let main;
  if (!S.hasKey) main = noKey();
  else if (S.view === 'upload') main = dropzone();
  else if (S.view === 'previa') main = `<div class="stack">${preview()}</div>`;
  else if (S.view === 'lendo') main = readingCard('A');
  else {
    main = `<div class="stack">${miniDrop()}${photoNotes()}`;
    if (S.frases.length) main += `<div><div class="lh">${selectAll()}${countLabel()}<span class="sp"></span><button class="btn btn-ghost" data-act="restart">${ic('redo')}Recomeçar</button></div>${rowsFlat()}<div class="a-foot-save">${saveBtn()}</div></div>`;
    else main += outcomeEmpty();
    main += `</div>`;
  }
  return `<div class="A">
    <aside class="a-side">
      <div class="a-brand">${logo(38)}<div><div class="nm">${COPY.nome}</div>${wm()}</div></div>
      <section><div class="lbl">Livro</div>${titleInput()}<p class="hint">Vai no Contexto de cada frase. Em branco: “Físico/Livro”.</p></section>
      <section><div class="lbl">Marcações que o Gemini lê</div>${legend()}</section>
      <div class="a-foot"><button class="btn btn-ghost" data-act="painel">${ic('back')}Voltar ao Painel</button></div>
    </aside>
    <main class="a-main"><header><h1>${COPY.nome}</h1><p>${COPY.sub}</p></header>${main}</main>
  </div>`;
}

/* ═══════════ Layout B · Fluxo ═══════════ */
function VB() {
  const { pend } = counts();
  let body = '';
  const hero = `<div class="b-hero"><h1>Da página marcada<br>para a sua lista de frases.</h1><p>${COPY.sub}</p></div>`;
  if (!S.hasKey) body = hero + noKey();
  else if (S.view === 'upload') body = hero + dropzone() + `<details class="b-help" open><summary>${ic('info')}Que marcações o Gemini lê?</summary>${legend()}</details>`;
  else if (S.view === 'previa') body = preview();
  else {
    if (S.view === 'lendo' || S.photos.some(p => p.status === 'lendo')) body += readingCard('B');
    else body += miniDrop();
    body += photoNotes();
    if (S.frases.length) body += `<div><div class="lh">${countLabel()}</div>${rowsFlat()}</div>`;
    else if (S.view === 'resultados') body += outcomeEmpty();
    if (S.view === 'resultados') body += `<details class="b-help"><summary>${ic('info')}Que marcações o Gemini lê?</summary>${legend()}</details>`;
  }
  const bar = (S.frases.length) ? `<div class="b-bar">${selectAll()}<span class="cnt">${counts().sel.length}/${pend.length}</span><span class="sp"></span><button class="btn btn-ghost" data-act="restart">${ic('redo')}Recomeçar</button>${saveBtn(false)}</div>` : '';
  return `<div class="B">
    <header class="b-top"><button class="btn-icon" data-act="painel" aria-label="Voltar ao Painel" title="Voltar ao Painel">${ic('back')}</button>${logo(30)}<div class="nm"><b>${COPY.nome}</b>${wm()}</div>
      <label class="b-book"><span>Livro</span>${titleInput()}</label></header>
    <main class="b-col">${body}</main>${bar}
  </div>`;
}

/* ═══════════ Layout C · Fotos × frases ═══════════ */
function VC() {
  const { reading } = counts();
  const busy = S.photos.some(p => p.status === 'lendo');
  const photoList = S.photos.map(p => `<div class="pc ${p.status}"><img src="${p.img}" alt=""><div style="min-width:0"><div class="nm">${p.name}</div><div style="margin-top:5px">${statusBadge(p)}</div>${p.why ? `<div class="why">${esc(p.why)}</div><button class="btn btn-secondary" data-act="retry" data-id="${p.id}" style="padding:5px 12px;font-size:12px;margin-top:6px">${ic('redo')}Tentar de novo</button>` : ''}</div></div>`).join('');
  const left = !S.hasKey ? `<div class="lbl">Fotos</div><p class="muted" style="font-size:12.5px">Adicione a chave do Gemini para começar.</p>` :
    `<div class="c-ph-h"><div class="lbl">Fotos</div><span class="mono muted" style="font-size:12px">${S.photos.length || ''}</span><span class="sp"></span>${busy ? `<button class="btn btn-secondary" data-act="cancel" style="padding:6px 12px">${ic('x')}Cancelar</button>` : ''}</div>
     ${busy ? `<div><div class="prog"><i style="width:${progressInfo().pct}%"></i></div><p class="mono muted" style="font-size:11.5px;margin-top:6px">${S.photos.length - reading.length} de ${S.photos.length} lidas</p></div>` : ''}
     <div class="dz-mini" data-act="${S.view === 'upload' ? 'pick' : 'pick1'}">${ic('plus')}<span class="grow">${S.photos.length ? 'Arraste mais páginas' : 'Arraste fotos de páginas marcadas'}</span><button class="btn btn-secondary" data-act="${S.view === 'upload' ? 'pick' : 'pick1'}">Escolher</button></div>
     ${photoList}`;
  let right;
  if (!S.hasKey) right = noKey();
  else if (S.view === 'upload') right = `<div class="empty acc" style="flex:1;align-content:center"><div class="ic">${ic('book')}</div><h3>${COPY.nome}</h3><p>${COPY.sub} As frases aparecem aqui, agrupadas por foto.</p><div style="margin-top:6px">${legend()}</div></div>`;
  else if (S.view === 'previa') right = preview();
  else {
    right = photoNotes();
    if (S.frases.length) right += `<div class="lh">${selectAll()}${countLabel()}<span class="sp"></span><button class="btn btn-ghost" data-act="restart">${ic('redo')}Recomeçar</button></div><div>${rowsByPhoto()}</div><div class="c-save">${saveBtn()}</div>`;
    else if (S.view === 'lendo') right += `<div class="empty acc"><div class="ic">${ic('scan')}</div><h3>Lendo a foto 1 de ${S.photos.length}…</h3><p>Procurando os trechos marcados. As frases aparecem aqui assim que cada foto termina.</p></div>`;
    else right += outcomeEmpty();
  }
  return `<div class="C">
    <header class="c-top">${logo(30)}<div class="nm"><b>${COPY.nome}</b>${wm()}</div>
      <label class="c-book"><span>Livro</span>${titleInput()}</label>
      <button class="btn btn-ghost back" data-act="painel">${ic('back')}Voltar ao Painel</button></header>
    <div class="c-body"><section class="c-photos">${left}${S.view === 'upload' || !S.photos.length ? '' : ''}<div class="c-legend"><div class="lbl">Marcações que o Gemini lê</div>${legend()}</div></section>
      <section class="c-fr">${right}</section></div>
  </div>`;
}

/* ═══════════ Switcher + render ═══════════ */
const ORDER = ['A', 'B', 'C'];
const NAMES = { A: 'Fiel (sidebar)', B: 'Fluxo (1 coluna)', C: 'Fotos × frases' };
const VIEWS = { A: VA, B: VB, C: VC };
const q = new URLSearchParams(location.search);
let V = ORDER.includes(q.get('variant')) ? q.get('variant') : 'C';
let theme = ['dark', 'light'].includes(q.get('theme')) ? q.get('theme') : 'dark';
let stateKey = STATES[q.get('state')] ? q.get('state') : 'inicio';

function syncURL() {
  const p = new URLSearchParams(location.search);
  p.set('variant', V); p.set('state', stateKey); if (theme !== 'dark') p.set('theme', theme); else p.delete('theme');
  history.replaceState(null, '', '?' + p.toString());
}
function loadState(k) { stateKey = k; fresh(); STATES[k][1](); syncURL(); render(); }

function render() {
  const app = document.getElementById('app');
  const focusEdit = document.activeElement?.dataset?.edit;
  app.innerHTML = VIEWS[V]() + (S.toast ? `<div class="toast" role="status"><div class="ic">${ic('check')}</div><div><b>${esc(S.toast)}</b><div class="muted" style="font-size:12px">Contexto: Livro · ${esc(S.title.trim() || 'Físico/Livro')}</div></div></div>` : '');
  if (S.confirm) { const n = S.frases.filter(f => !f.saved).length;
    app.insertAdjacentHTML('beforeend', `<div class="scrim" data-act="closeConfirm"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="cfh" data-act="noop">
      <h3 id="cfh">Descartar ${n} ${plural(n, 'frase não minerada', 'frases não mineradas')}?</h3>
      <p class="muted" style="margin-top:6px">${plural(n, 'Ela ainda não foi minerada e vai se perder', 'Elas ainda não foram mineradas e vão se perder')}.</p>
      <div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn btn-ghost" data-act="closeConfirm">Cancelar</button><button class="btn btn-secondary" data-act="confirmRestart" style="color:var(--danger);border-color:var(--danger)">Descartar ${n} ${plural(n, 'frase', 'frases')}</button></div></div></div>`); }
  app.querySelectorAll('[data-mixed]').forEach(el => el.indeterminate = true);
  if (focusEdit) app.querySelector(`[data-edit="${focusEdit}"]`)?.focus();
  document.documentElement.dataset.theme = theme;
  document.getElementById('lab').textContent = `${V} · ${NAMES[V]}`;
  document.getElementById('theme').textContent = theme === 'dark' ? '☾ Escuro' : '☀ Claro';
  document.getElementById('st').value = stateKey;
}
function cycle(d) { V = ORDER[(ORDER.indexOf(V) + d + ORDER.length) % ORDER.length]; syncURL(); render(); }

document.getElementById('st').innerHTML = Object.entries(STATES).map(([k, [n]]) => `<option value="${k}">Estado: ${n}</option>`).join('');
document.getElementById('st').addEventListener('change', e => loadState(e.target.value));
document.getElementById('prev').onclick = () => cycle(-1);
document.getElementById('next').onclick = () => cycle(1);
document.getElementById('theme').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; syncURL(); render(); };
document.getElementById('vdbtn').onclick = () => document.getElementById('vd').classList.toggle('hidden');
document.getElementById('vdclose').onclick = () => document.getElementById('vd').classList.add('hidden');

const typing = el => el && (el.matches('input,textarea,select') || el.isContentEditable);
document.addEventListener('keydown', e => {
  if (typing(document.activeElement)) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  else if (e.key === 'ArrowRight') cycle(1);
  else if (e.key === 't' || e.key === 'T') { theme = theme === 'dark' ? 'light' : 'dark'; syncURL(); render(); }
  else if ((e.key === 'Enter' || e.key === ' ') && document.activeElement?.dataset?.act === 'pick') { e.preventDefault(); addPhotos(1); }
});

/* Ações da tela (simuladas: "escolher fotos" gera páginas falsas) */
document.getElementById('app').addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'tog' || a === 'all') return; // tratado em change
  e.stopPropagation();
  ({
    pick: () => addPhotos(1),
    pick4: () => addPhotos(4),
    pick1: () => addPhotos(1),
    read: startBatch,
    cancel: cancelBatch,
    restart: askRestart,
    confirmRestart: restart,
    closeConfirm: () => { S.confirm = false; render(); },
    retry: () => retry(+el.dataset.id),
    save,
    cfg: () => showToast('(protótipo) abriria Painel · Configurações · Chave Gemini') || render(),
    painel: () => showToast('(protótipo) voltaria ao Painel') || render(),
    givekey: () => { S.hasKey = true; render(); },
  })[a]?.();
});
document.getElementById('app').addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.act === 'tog') { const f = S.frases.find(x => x.id === +t.dataset.id); f.on = t.checked; render(); }
  if (t.dataset.act === 'all') { S.frases.forEach(f => { if (!f.saved) f.on = t.checked; }); render(); }
});
document.getElementById('app').addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.bind === 'title') S.title = t.value;
  if (t.dataset.edit) { const f = S.frases.find(x => x.id === +t.dataset.edit); f.text = t.textContent; }
});
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); const n = [...(e.dataTransfer?.files || [])].filter(f => f.type.startsWith('image/')).length; if (n) addPhotos(n); });

/* Veredito → Lavish */
document.getElementById('vdform').addEventListener('submit', e => {
  e.preventDefault();
  const d = new FormData(e.currentTarget);
  const ans = { layout: d.get('layout') || '(não escolhido)', cancelar: d.get('cancel'), recomecar: d.get('recomecar'), verbo: d.get('verbo'), notas: (d.get('notas') || '').trim() };
  const text = `Veredito do protótipo BookReader (#7): layout = ${ans.layout}; Cancelar = ${ans.cancelar}; Recomeçar = ${ans.recomecar}; verbo do botão = ${ans.verbo}.${ans.notas ? ' Notas: ' + ans.notas : ''}`;
  const out = document.getElementById('vdout');
  if (window.lavish?.queuePrompt) {
    window.lavish.queuePrompt(text, { tag: 'choice', text: 'Veredito BookReader', element: e.currentTarget, queueKey: 'bookreader-veredito', data: ans });
    out.innerHTML = `<div class="sent">Na fila do Lavish. Aperte <b>Send to Agent</b> para enviar. (Reenviar substitui esta resposta.)</div>`;
  } else out.innerHTML = `<pre>${esc(text)}</pre>`;
});

fresh(); STATES[stateKey][1](); syncURL(); render();
</script>
</body>
</html>
