<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vídeo simulado · preview do overlay</title>
<!-- Um player de mentira, sem vídeo de verdade: o que o preview mostra aqui é o overlay da extensão
     (o botão flutuante e o aviso de frase minerada), que `montar.mjs` carrega como o manifest manda.
     As cores são as de um vídeo qualquer, não as da Veio: esta página faz o papel de um site de terceiros. -->
<link rel="stylesheet" href="veio/tokens.css">
<style>
  html, body { margin: 0; height: 100%; background: #0c0b0a; overflow: hidden; }
  .player { position: relative; width: 100%; height: 100%; font-family: var(--veio-fonte-ui); }
  video {
    width: 100%; height: 100%; display: block;
    background:
      radial-gradient(ellipse 60% 45% at 30% 38%, rgba(232, 168, 84, .55), transparent 70%),
      radial-gradient(ellipse 70% 40% at 72% 30%, rgba(96, 128, 158, .50), transparent 70%),
      linear-gradient(180deg, #2a3646 0%, #48607a 46%, #1b2530 47%, #11171e 100%);
  }
  .caption-window { position: absolute; left: 6%; right: 6%; bottom: 19%; text-align: center; }
  .caption-text { color: #fff; font-size: clamp(17px, 2.6vw, 34px); font-weight: 500; line-height: 1.35; background: rgba(0, 0, 0, .65); padding: .12em .4em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .barra { position: absolute; left: 0; right: 0; bottom: 0; height: 9%; min-height: 40px; display: flex; align-items: center; gap: 2.2%; padding: 0 3%; background: linear-gradient(transparent, rgba(0, 0, 0, .7)); color: #ddd; font-size: clamp(11px, 1.2vw, 15px); }
  .barra .trilha { flex: 1; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .28); }
  .barra .trilha i { display: block; width: 38%; height: 100%; border-radius: 2px; background: #e8a854; }
  .barra .play { width: 0; height: 0; border-left: 14px solid #ddd; border-top: 9px solid transparent; border-bottom: 9px solid transparent; }
</style>
</head>
<body>
  <div class="player">
    <video muted></video>
    <div class="caption-window"><span class="caption-text" lang="en">The quiet harbor woke before the gulls did.</span></div>
    <div class="barra" aria-hidden="true"><span class="play"></span><span>12:41</span><div class="trilha"><i></i></div><span>33:20</span></div>
  </div>
</body>
</html>
